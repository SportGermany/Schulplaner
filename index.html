<!doctype html>
<html lang="de">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Lernplan</title>
<meta name="description" content="Lernplan für die Realschule in Bayern: Kalender mit Ferien, Stundenplan, Hausaufgaben, Noten, Lehrgänge, Fehlzeiten und Lernzeit">
<meta name="theme-color" content="#f7f7f5">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Lernplan">
<link rel="manifest" href="manifest.json">
<link rel="icon" type="image/png" href="icon-192.png">
<link rel="apple-touch-icon" href="icon-192.png">
<style>
:root{
  --bg:#f6f6f4;--surface:#ffffff;--surface2:#efefec;--text:#1d1d1c;--muted:#74736d;--line:#e4e3df;
  --accent:#2f6fed;--accent-soft:#e9effd;--danger:#d93025;--good:#2f9a64;--warnc:#c2410c;
  --ferien:#e3f2e7;--ferien-text:#1b7a38;--feiertag:#d93025;--weekend:#fafaf8;
  --grid:#ecebe7;
  --shadow:0 1px 2px rgba(0,0,0,.04),0 4px 14px rgba(0,0,0,.05);
  --r:14px;color-scheme:light;
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    --bg:#151515;--surface:#202020;--surface2:#2a2a2a;--text:#ecebe8;--muted:#9b9a95;--line:#303030;
    --accent:#6f9dff;--accent-soft:#1d2842;--danger:#ff6b61;--good:#4cc38a;--warnc:#ff9f5a;
    --ferien:#153020;--ferien-text:#7fd699;--feiertag:#ff7b72;--weekend:#1a1a1a;--grid:#2c2c2c;
    --shadow:0 1px 2px rgba(0,0,0,.4);color-scheme:dark;
  }
}
:root[data-theme="dark"]{
  --bg:#151515;--surface:#202020;--surface2:#2a2a2a;--text:#ecebe8;--muted:#9b9a95;--line:#303030;
  --accent:#6f9dff;--accent-soft:#1d2842;--danger:#ff6b61;--good:#4cc38a;--warnc:#ff9f5a;
  --ferien:#153020;--ferien-text:#7fd699;--feiertag:#ff7b72;--weekend:#1a1a1a;--grid:#2c2c2c;
  --shadow:0 1px 2px rgba(0,0,0,.4);color-scheme:dark;
}
*{box-sizing:border-box}
[hidden]{display:none!important}
html,body{margin:0}
html{scroll-padding-top:90px;scroll-padding-bottom:calc(100px + env(safe-area-inset-bottom))}
body{font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,"Helvetica Neue",Arial,sans-serif;background:var(--bg);color:var(--text);font-size:15px;line-height:1.4;-webkit-tap-highlight-color:transparent;overscroll-behavior-y:contain;-webkit-font-smoothing:antialiased}
button{font:inherit;color:inherit;background:none;border:0;padding:0;cursor:pointer;text-align:inherit}
input,select,textarea{font:inherit;color:inherit}
svg{display:block}

/* Kopf */
.top{position:sticky;top:0;z-index:20;background:color-mix(in srgb,var(--bg) 90%,transparent);-webkit-backdrop-filter:saturate(1.4) blur(12px);backdrop-filter:saturate(1.4) blur(12px);padding:calc(env(safe-area-inset-top) + 10px) 16px 6px}
.top-row{display:flex;align-items:center;gap:2px;max-width:760px;margin:0 auto}
.top h1{font-size:21px;font-weight:760;margin:0;flex:1;letter-spacing:-.015em;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.ib{width:38px;height:38px;border-radius:11px;display:grid;place-items:center;color:var(--muted);flex:none;position:relative}
.ib:active{background:var(--surface2)}
.ib svg{width:21px;height:21px}
.syncdot{position:absolute;right:6px;top:7px;width:8px;height:8px;border-radius:50%;background:var(--good);box-shadow:0 0 0 2px var(--bg)}
.syncdot.busy{background:var(--accent);animation:pulse 1s infinite}
.syncdot.err{background:var(--danger)}
.syncdot.off{background:var(--muted)}
@keyframes pulse{50%{opacity:.3}}
.btn-today{border:1px solid var(--line);background:var(--surface);border-radius:999px;padding:5px 12px;font-size:13px;font-weight:650;margin:0 2px}
.subnav{display:flex;gap:6px;max-width:760px;margin:8px auto 2px;overflow-x:auto;scrollbar-width:none}
.subnav::-webkit-scrollbar{display:none}

/* Chips */
.chip{border:1px solid var(--line);background:var(--surface);border-radius:999px;padding:6px 12px;font-size:13.5px;font-weight:560;white-space:nowrap;display:inline-flex;align-items:center;gap:6px;flex:none}
.chip.on{background:var(--text);color:var(--bg);border-color:var(--text)}
.chip.sm{padding:4px 10px;font-size:12.5px}
.dot{width:8px;height:8px;border-radius:50%;background:var(--c,#999);flex:none;display:inline-block}

main{max-width:760px;margin:0 auto;padding:2px 16px calc(124px + env(safe-area-inset-bottom))}
.sec{font-size:12.5px;font-weight:720;color:var(--muted);text-transform:uppercase;letter-spacing:.05em;margin:24px 2px 8px;display:flex;align-items:center;gap:8px}
.sec .cnt{background:var(--surface2);border-radius:99px;padding:0 7px;font-size:11.5px}
.sec .more{margin-left:auto;text-transform:none;letter-spacing:0;color:var(--accent);font-weight:650;font-size:13px}
.card{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:14px;box-shadow:var(--shadow)}
.stack>*+*{margin-top:8px}
.muted{color:var(--muted)}
.small{font-size:12.5px}
.empty{text-align:center;color:var(--muted);padding:26px 12px;font-size:14px}
.row{display:flex;align-items:center;gap:8px}
.grow1{flex:1;min-width:0}

/* Tabs */
.tabs{position:fixed;left:0;right:0;bottom:0;z-index:30;background:color-mix(in srgb,var(--surface) 94%,transparent);-webkit-backdrop-filter:blur(14px);backdrop-filter:blur(14px);border-top:1px solid var(--line);display:grid;grid-template-columns:repeat(6,1fr);padding:6px 2px calc(6px + env(safe-area-inset-bottom))}
.tab{display:flex;flex-direction:column;align-items:center;gap:2px;font-size:10px;font-weight:650;color:var(--muted);padding:4px 0;text-align:center}
.tab svg{width:23px;height:23px}
.tab.on{color:var(--accent)}
.fab{position:fixed;right:18px;bottom:calc(80px + env(safe-area-inset-bottom));z-index:31;width:58px;height:58px;border-radius:18px;background:var(--accent);color:#fff;display:grid;place-items:center;box-shadow:0 8px 22px color-mix(in srgb,var(--accent) 40%,transparent)}
.fab svg{width:27px;height:27px}
.fab:active{transform:scale(.95)}

/* Heute */
.hero{margin:4px 2px 12px}
.hero .hwd{color:var(--muted);font-weight:650;font-size:14px}
.hero .big{font-size:30px;font-weight:790;letter-spacing:-.025em;line-height:1.15}
.status{display:flex;gap:12px;align-items:flex-start}
.status .ic{font-size:25px;line-height:1.1}
.status .body{flex:1;min-width:0}
.st-t{font-weight:720;font-size:16px;letter-spacing:-.01em}
.st-s{color:var(--muted);font-size:13px;margin-top:3px}
.prog{height:6px;border-radius:99px;background:var(--surface2);margin-top:10px;overflow:hidden}
.prog i{display:block;height:100%;background:var(--accent);border-radius:99px}
.status.ferien{background:var(--ferien);border-color:transparent}
.status.ferien .st-t{color:var(--ferien-text)}
.qa-row{display:grid;grid-template-columns:repeat(4,1fr);gap:8px;margin-top:12px}
.qa-btn{background:var(--surface);border:1px solid var(--line);border-radius:13px;padding:10px 4px 8px;display:flex;flex-direction:column;align-items:center;gap:4px;font-size:11.5px;font-weight:650;box-shadow:var(--shadow);text-align:center}
.qa-btn .e{font-size:19px;line-height:1}
.lessons{padding:4px 0;overflow:hidden}
.les{display:flex;align-items:center;gap:10px;padding:8px 14px}
.les+.les{border-top:1px solid var(--line)}
.les .pn{width:22px;text-align:center;font-weight:750;color:var(--muted);font-size:13px}
.les .tm{width:44px;font-size:12px;color:var(--muted);line-height:1.2}
.les .sb{flex:1;min-width:0;font-weight:650;display:flex;align-items:center;gap:7px}
.les .rm{font-size:12.5px;color:var(--muted);white-space:nowrap}
.les.now{background:var(--accent-soft)}
.les.now .pn{color:var(--accent)}
.les.past{opacity:.45}
.les .badge{font-size:10.5px;font-weight:800;color:#fff;background:var(--c);border-radius:5px;padding:1px 5px}
.next{display:flex;gap:12px;align-items:center;padding:12px;cursor:pointer}
.nc-count{min-width:58px;text-align:center;border-radius:12px;background:color-mix(in srgb,var(--c) 14%,transparent);padding:7px 4px;color:var(--c);flex:none}
.nc-count b{display:block;font-size:24px;line-height:1.1;font-weight:800}
.nc-count span{font-size:11px;font-weight:700}
.nc-body{flex:1;min-width:0}
.nc-t{font-weight:720;display:flex;align-items:center;gap:6px}
.nc-t .t{white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.nc-d{font-size:13px;color:var(--muted)}
.nc-notes{font-size:13px;margin-top:2px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.tag{display:inline-block;font-size:11.5px;font-weight:700;border-radius:6px;padding:2px 7px;margin-top:6px;background:var(--surface2);color:var(--muted)}
.tag.hot{background:color-mix(in srgb,#e5484d 14%,transparent);color:#e5484d}
.tag.ok{background:color-mix(in srgb,#30a46c 15%,transparent);color:var(--good)}
.tag.btnlike{cursor:pointer;background:var(--accent-soft);color:var(--accent);margin-left:4px}
.chk{width:36px;height:36px;border-radius:50%;border:2px solid var(--line);display:grid;place-items:center;flex:none;color:transparent}
.chk svg{width:18px;height:18px}
.chk.on{background:var(--good);border-color:var(--good);color:#fff}
.chk.sm{width:28px;height:28px}
.chk.sm svg{width:15px;height:15px}
.warn{display:flex;gap:10px;align-items:flex-start;background:color-mix(in srgb,#f76b15 10%,var(--surface));border:1px solid color-mix(in srgb,#f76b15 28%,transparent);border-radius:12px;padding:10px 12px;font-size:13.5px}
.info{display:flex;gap:10px;align-items:flex-start;background:var(--accent-soft);border-radius:12px;padding:10px 12px;font-size:13.5px}
.goodbox{background:color-mix(in srgb,#30a46c 12%,var(--surface));border:1px solid color-mix(in srgb,#30a46c 30%,transparent)}
.tip{background:var(--accent-soft);border:0}
.tip b{color:var(--accent)}
.tip .rowb{display:flex;gap:8px;margin-top:10px;flex-wrap:wrap}

/* Agenda */
.ag-day{display:flex;gap:10px;padding:10px 0;border-top:1px solid var(--line)}
.ag-day:first-child{border-top:0}
.ag-date{width:44px;flex:none;display:flex;flex-direction:column;align-items:center;padding-top:2px;text-align:center}
.ag-date span{font-size:12px;color:var(--muted);font-weight:650}
.ag-date b{font-size:19px;width:36px;height:36px;display:grid;place-items:center;border-radius:50%;font-weight:700}
.is-today .ag-date b{background:var(--accent);color:#fff}
.ag-items{flex:1;min-width:0;display:flex;flex-direction:column;gap:6px}
.ag-rel{font-size:12.5px;color:var(--muted);font-weight:650;margin-top:3px}

/* Karten */
.ev{display:flex;align-items:stretch;gap:10px;width:100%;background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:9px 11px 9px 0;overflow:hidden;box-shadow:var(--shadow);cursor:pointer}
.ev:active{transform:scale(.99)}
.ev-bar{width:4px;border-radius:0 4px 4px 0;background:var(--c);flex:none}
.ev-main{flex:1;min-width:0}
.ev-l1{display:flex;align-items:center;gap:7px;font-weight:680}
.ev-l1 .t{white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.pill{font-size:10.5px;font-weight:800;color:#fff;background:var(--c);border-radius:5px;padding:1px 5px;flex:none;letter-spacing:.02em}
.ev-l2{font-size:12.5px;color:var(--muted);display:flex;align-items:center;gap:5px 8px;flex-wrap:wrap;margin-top:2px}
.ev-l2 .it{display:inline-flex;align-items:center;gap:5px}
.ev-notes{font-size:12.5px;margin-top:3px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;opacity:.85}
.ev-side{display:flex;flex-direction:column;align-items:flex-end;justify-content:center;gap:4px;font-size:12px;font-weight:700;color:var(--muted);flex:none}
.ev-side .cd{color:var(--c)}
.ev-side .ok{color:var(--good)}
.gchip{display:inline-grid;place-items:center;min-width:28px;height:24px;padding:0 6px;border-radius:7px;font-weight:780;font-size:13px;background:var(--surface2);color:var(--text)}
.gchip.big{box-shadow:inset 0 0 0 1.5px var(--text)}
.g1,.g2{background:color-mix(in srgb,#30a46c 18%,transparent)}
.g3{background:color-mix(in srgb,#c99200 18%,transparent)}
.g4{background:color-mix(in srgb,#f76b15 20%,transparent)}
.g5,.g6{background:color-mix(in srgb,#e5484d 22%,transparent)}
.ev.past{opacity:.62}
.ev.official{border-style:dashed}
.banner{display:flex;align-items:center;gap:8px;border-radius:10px;padding:8px 11px;font-size:13.5px;font-weight:650;width:100%}
.banner.fe{background:var(--ferien);color:var(--ferien-text)}
.banner.ft{background:color-mix(in srgb,var(--feiertag) 11%,transparent);color:var(--feiertag)}
.banner.learn{background:var(--accent-soft);color:var(--accent);cursor:pointer}
.banner.school{background:var(--surface2);color:var(--muted)}
.banner.abs{background:color-mix(in srgb,#8e4ec6 12%,transparent);color:#8e4ec6;cursor:pointer}
.banner .sub{font-weight:500;opacity:.85;margin-left:auto;font-size:12.5px;text-align:right}

/* Hausaufgaben */
.hw{display:flex;align-items:flex-start;gap:10px;padding:11px 12px;background:var(--surface);border:1px solid var(--line);border-radius:12px;box-shadow:var(--shadow)}
.hw .body{flex:1;min-width:0;cursor:pointer}
.hw .txt{font-weight:600;white-space:pre-wrap;word-break:break-word}
.hw .meta{font-size:12.5px;color:var(--muted);display:flex;gap:6px 10px;flex-wrap:wrap;margin-top:2px;align-items:center}
.hw.done .txt{text-decoration:line-through;color:var(--muted)}
.hw .due{font-weight:700}
.hw .due.over{color:var(--danger)}
.hw .due.soon{color:var(--warnc)}
.hgroup{font-size:13px;font-weight:750;margin:18px 2px 8px;display:flex;gap:8px;align-items:center}

/* Monat */
.mwrap{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);overflow:hidden;box-shadow:var(--shadow);margin-top:4px}
.mgrid{display:grid;grid-template-columns:repeat(7,minmax(0,1fr))}
.mgrid.kw{grid-template-columns:19px repeat(7,minmax(0,1fr))}
.mh{font-size:11px;font-weight:700;color:var(--muted);text-align:center;padding:7px 0;border-bottom:1px solid var(--line)}
.kwc{font-size:9px;color:var(--muted);text-align:center;padding-top:7px;border-bottom:1px solid var(--line);background:var(--surface2);font-weight:650}
.kwc i{display:block;font-style:normal;font-size:8px;margin-top:2px;color:var(--accent);font-weight:800}
.cell{min-height:74px;border-bottom:1px solid var(--line);border-left:1px solid var(--line);padding:3px 2px 3px 3px;display:flex;flex-direction:column;align-items:stretch;min-width:0;text-align:left}
.cell.c0{border-left:0}
.mgrid.kw .cell.c0{border-left:1px solid var(--line)}
.cell.we{background:var(--weekend)}
.cell.fe{background:var(--ferien)}
.cell.out{opacity:.38}
.num{font-size:12.5px;font-weight:650;width:23px;height:23px;display:grid;place-items:center;border-radius:50%;flex:none}
.cell.ft .num{color:var(--feiertag)}
.cell.today .num{background:var(--accent);color:#fff}
.cell.sel{box-shadow:inset 0 0 0 2px var(--accent);border-radius:3px}
.hn{font-size:8.5px;font-weight:700;line-height:1.15;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;color:var(--ferien-text);margin:1px 0 1px 1px}
.hn.r{color:var(--feiertag)}
.mc{display:block;font-size:9.5px;line-height:14px;font-weight:650;border-radius:3px;padding:0 2px 0 3px;margin-top:2px;background:color-mix(in srgb,var(--c) 20%,transparent);border-left:2px solid var(--c);white-space:nowrap;overflow:hidden;font-style:normal}
.mdots{display:flex;gap:2px;margin-top:3px;padding-left:2px}
.mdots i{width:5px;height:5px;border-radius:50%;background:var(--c)}
.more{font-size:9.5px;color:var(--muted);padding-left:3px;font-weight:650}
.legend{display:flex;flex-wrap:wrap;gap:6px;margin-top:10px}
.lg{font-size:12px;font-weight:650;border-radius:8px;padding:4px 9px;background:var(--ferien);color:var(--ferien-text)}
.lg.r{background:color-mix(in srgb,var(--feiertag) 10%,transparent);color:var(--feiertag)}
@media(min-width:600px){.cell{min-height:100px}.mc{font-size:11px;line-height:17px}.hn{font-size:10px}.num{font-size:13.5px}}

/* Tag */
.wstrip{display:grid;grid-template-columns:repeat(7,1fr);gap:4px;margin:4px 0 14px}
.wd{display:flex;flex-direction:column;align-items:center;gap:3px;padding:6px 0 5px;border-radius:12px}
.wd span{font-size:11px;color:var(--muted);font-weight:650}
.wd b{font-size:16px;width:34px;height:34px;display:grid;place-items:center;border-radius:50%;font-weight:700}
.wd.fe{background:var(--ferien)}
.wd.ft b{color:var(--feiertag)}
.wd.today b{color:var(--accent)}
.wd.sel b{background:var(--text);color:var(--bg)}
.wd .dots{display:flex;gap:2px;height:5px}
.wd .dots i{width:5px;height:5px;border-radius:50%;background:var(--c)}
.day-head{margin:0 2px 12px}
.day-head .rel{color:var(--accent);font-weight:700;font-size:13.5px}
.day-head h2{margin:0;font-size:23px;letter-spacing:-.02em;font-weight:760}
.day-head .kw{color:var(--muted);font-size:13px}
.addline{display:flex;align-items:center;justify-content:center;gap:6px;width:100%;border:1.5px dashed var(--line);border-radius:12px;padding:11px;color:var(--muted);font-weight:650;font-size:14px;margin-top:10px}
.addline svg{width:18px;height:18px}

/* Stundenplan */
.ttwrap{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);overflow:hidden;box-shadow:var(--shadow)}
.tt{display:grid;grid-template-columns:38px repeat(var(--days,5),minmax(0,1fr))}
.tt .th{font-size:11.5px;font-weight:750;color:var(--muted);text-align:center;padding:8px 0 6px;border-bottom:1px solid var(--line)}
.tt .th.today{color:var(--accent)}
.tt .tp{border-bottom:1px solid var(--line);text-align:center;padding:5px 0;font-size:12px;font-weight:750;color:var(--muted);line-height:1.1}
.tt .tp small{display:block;font-size:8.5px;font-weight:600;margin-top:2px}
.tt .tp.now{color:var(--accent)}
.tt .tc{border-bottom:1px solid var(--line);border-left:1px solid var(--line);min-height:50px;padding:3px;display:flex;flex-direction:column;justify-content:center;align-items:stretch;min-width:0}
.tt .tc.today{background:color-mix(in srgb,var(--accent) 5%,transparent)}
.tt .tc .in{background:color-mix(in srgb,var(--c) 18%,transparent);border-left:3px solid var(--c);border-radius:5px;padding:3px 4px;height:100%;display:flex;flex-direction:column;justify-content:center;min-width:0}
.tt .tc .in b{font-size:12.5px;font-weight:780;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.tt .tc .in span{font-size:9.5px;color:var(--muted);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.tt .tc .in.ab{position:relative}
.tt .tc .in.ab::after{content:attr(data-w);position:absolute;right:2px;top:1px;font-size:8px;font-weight:800;color:var(--muted)}
.tt .tc.nowcell{box-shadow:inset 0 0 0 2px var(--accent)}
.tt .brk{grid-column:1/-1;height:6px;background:var(--surface2);border-bottom:1px solid var(--line)}
@media(min-width:600px){.tt .tc{min-height:62px}.tt .tc .in b{font-size:14px}.tt .tc .in span{font-size:11px}}

/* Noten */
.seg{display:grid;grid-auto-flow:column;grid-auto-columns:1fr;background:var(--surface2);border-radius:11px;padding:3px;margin:4px 0 12px}
.seg button{padding:7px 0;border-radius:9px;font-size:13.5px;font-weight:650;color:var(--muted);text-align:center}
.seg button.on{background:var(--surface);color:var(--text);box-shadow:0 1px 3px rgba(0,0,0,.12)}
.hero-avg{display:flex;align-items:center;gap:14px}
.hero-avg .v{font-size:38px;font-weight:820;letter-spacing:-.03em;line-height:1}
.hero-avg .l{font-size:13px;color:var(--muted)}
.srow{display:flex;align-items:center;gap:10px;padding:12px 14px;border-top:1px solid var(--line);cursor:pointer;width:100%}
.srow:first-child{border-top:0}
.srow .nm{font-weight:680;display:flex;align-items:center;gap:7px}
.srow .gs{display:flex;gap:4px;flex-wrap:wrap;margin-top:5px}
.srow .avg{margin-left:auto;text-align:right;flex:none}
.srow .avg b{display:block;font-size:20px;font-weight:810;letter-spacing:-.02em}
.srow .avg span{font-size:11.5px;color:var(--muted);font-weight:650}
.srow.nog{opacity:.55}
.lcard{padding:0;overflow:hidden}
.frow{display:flex;align-items:center;gap:12px;padding:11px 14px;border-top:1px solid var(--line)}
.frow:first-child{border-top:0}
.frow .fn{font-weight:680}
.frow .fd{font-size:12.5px;color:var(--muted)}
.frow .fs{margin-left:auto;font-size:12px;font-weight:700;color:var(--muted);text-align:right;white-space:nowrap}
.frow.now{background:var(--ferien)}
.frow.now .fs{color:var(--ferien-text)}
.frow.past{opacity:.45}
.frow.minor .fn{font-weight:550}
.grow{display:flex;align-items:center;gap:12px;padding:11px 14px;border-top:1px solid var(--line)}
.grow:first-child{border-top:0}
.linkbtn{color:var(--accent);font-weight:650;font-size:14px;padding:10px 2px}
.stats{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}
.stat{background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:10px 12px;box-shadow:var(--shadow)}
.stat b{display:block;font-size:22px;font-weight:810;letter-spacing:-.02em}
.stat span{font-size:12px;color:var(--muted);font-weight:600}
.chart{width:100%;height:auto;overflow:visible}
.chart .gl{stroke:var(--grid);stroke-width:1}
.chart .ax{fill:var(--muted);font-size:10px}
.chart .ln{fill:none;stroke:var(--accent);stroke-width:2;stroke-linejoin:round;stroke-linecap:round}
.chart .pt{fill:var(--accent);stroke:var(--surface);stroke-width:2}
.chart .pt.big{fill:var(--surface);stroke:var(--accent);stroke-width:2.5}
.chart .lbl{fill:var(--text);font-size:10.5px;font-weight:700}
.chart .avgl{stroke:var(--muted);stroke-width:1.2;stroke-dasharray:4 4}
.chart .bar{fill:var(--accent)}
.chart .hit{fill:transparent;cursor:pointer}
.ctip{position:fixed;z-index:70;background:var(--text);color:var(--bg);font-size:12.5px;font-weight:600;border-radius:8px;padding:6px 9px;pointer-events:none;max-width:220px;box-shadow:0 6px 18px rgba(0,0,0,.2)}
.hbar{display:flex;align-items:center;gap:10px;padding:6px 0}
.hbar .n{width:92px;font-size:13px;font-weight:600;display:flex;align-items:center;gap:6px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;flex:none}
.hbar .tr{flex:1;height:10px;background:var(--surface2);border-radius:99px;overflow:hidden}
.hbar .tr i{display:block;height:100%;background:var(--accent);border-radius:99px}
.hbar .v{width:52px;text-align:right;font-size:12.5px;font-weight:700;color:var(--muted);flex:none}
.aptab{width:100%;border-collapse:collapse;font-size:13.5px}
.aptab th{font-size:11px;color:var(--muted);text-align:center;font-weight:700;padding:6px 2px;border-bottom:1px solid var(--line)}
.aptab th:first-child{text-align:left}
.aptab td{padding:7px 2px;border-bottom:1px solid var(--line);text-align:center}
.aptab td:first-child{text-align:left;font-weight:650}
.aptab input{width:44px;text-align:center;padding:6px 2px;border-radius:8px;border:1px solid var(--line);background:var(--surface2);font-size:15px}
.aptab .res{font-weight:820;font-size:16px}
.aptab .hint{display:block;font-size:10.5px;color:var(--muted);font-weight:600}

/* Timer */
.timer{text-align:center;padding:18px 14px}
.timer .clock{font-size:52px;font-weight:800;letter-spacing:-.03em;font-variant-numeric:tabular-nums;line-height:1.05}
.timer .subj{color:var(--muted);font-weight:650;margin-top:4px}
.timer .btns{display:flex;gap:8px;justify-content:center;margin-top:14px;flex-wrap:wrap}

/* Sheet */
.sheet-wrap{position:fixed;inset:0;z-index:50;background:rgba(0,0,0,.4);display:flex;align-items:flex-end;justify-content:center;animation:fade .18s}
.sheet{background:var(--surface);width:100%;max-width:640px;max-height:94dvh;overflow-y:auto;border-radius:20px 20px 0 0;padding:0 16px calc(24px + env(safe-area-inset-bottom));animation:up .24s cubic-bezier(.2,.8,.2,1);overscroll-behavior:contain}
@media(min-width:700px){.sheet-wrap{align-items:center}.sheet{border-radius:20px;max-height:88vh}}
.sheet-h{position:sticky;top:0;background:var(--surface);display:flex;align-items:center;justify-content:space-between;gap:8px;padding:12px 0 10px;z-index:2;border-bottom:1px solid var(--line);margin-bottom:12px}
.sheet-h b{font-size:16px;text-align:center;flex:1}
.link{color:var(--accent);font-weight:650;padding:6px 2px;min-width:70px}
.btn{background:var(--accent);color:#fff;font-weight:700;border-radius:11px;padding:9px 15px;font-size:14.5px;text-align:center}
.btn.ghost{background:var(--surface2);color:var(--text)}
.btn.danger{background:color-mix(in srgb,var(--danger) 12%,transparent);color:var(--danger)}
.btn.good{background:var(--good)}
.btn.wide{display:block;width:100%;padding:13px;margin-top:18px;font-size:15.5px}
.btn:disabled{opacity:.5}
.fl{display:block;font-size:12.5px;font-weight:700;color:var(--muted);margin:16px 0 6px}
.inp{width:100%;padding:11px 12px;border-radius:11px;border:1px solid var(--line);background:var(--surface2);font-size:16px;outline:none;min-width:0}
.inp:focus{border-color:var(--accent);background:var(--surface)}
textarea.inp{min-height:84px;resize:vertical}
select.inp{appearance:auto}
.row2{display:grid;grid-template-columns:1.35fr 1fr;gap:8px}
.row3{display:grid;grid-template-columns:1fr 1fr 1fr;gap:8px}
.wrap{display:flex;flex-wrap:wrap;gap:6px}
.hscroll{display:flex;gap:6px;overflow-x:auto;padding:2px 0 4px;scrollbar-width:none}
.hscroll::-webkit-scrollbar{display:none}
.tchip{border-radius:999px;padding:7px 12px;font-size:13.5px;font-weight:650;border:1.5px solid color-mix(in srgb,var(--c) 45%,transparent)}
.tchip.on{background:var(--c);border-color:var(--c);color:#fff}
.gbtns{display:grid;grid-template-columns:repeat(6,1fr);gap:6px}
.gbtns button{padding:11px 0;border-radius:11px;background:var(--surface2);font-weight:800;font-size:17px;text-align:center}
.gbtns button.on{background:var(--accent);color:#fff}
.tend{display:grid;grid-template-columns:repeat(3,1fr);gap:6px;margin-top:6px}
.tend button{padding:7px 0;border-radius:9px;background:var(--surface2);font-weight:700;font-size:13px;text-align:center}
.tend button.on{background:var(--text);color:var(--bg)}
.quick{background:var(--accent-soft);border-radius:14px;padding:10px}
.quick .inp{background:var(--surface);border-color:transparent}
.qa-hint{font-size:12px;color:var(--muted);margin:7px 2px 0}
.qa-prev{display:flex;flex-wrap:wrap;gap:5px}
.qa-prev:not(:empty){margin-top:8px}
.qa-prev span{font-size:12px;font-weight:700;background:var(--surface);border-radius:6px;padding:3px 8px;display:inline-flex;align-items:center;gap:5px}
.switch{display:flex;align-items:center;justify-content:space-between;gap:12px;padding:12px 0 2px;font-weight:600}
.switch small{display:block;font-weight:500;color:var(--muted);font-size:12px}
.tgl{appearance:none;-webkit-appearance:none;width:46px;height:28px;border-radius:99px;background:var(--line);position:relative;transition:background .2s;flex:none;cursor:pointer;margin:0}
.tgl::after{content:"";position:absolute;top:3px;left:3px;width:22px;height:22px;border-radius:50%;background:#fff;transition:left .2s;box-shadow:0 1px 3px rgba(0,0,0,.3)}
.tgl:checked{background:var(--accent)}
.tgl:checked::after{left:21px}
.actions{display:flex;gap:8px;flex-wrap:wrap;margin-top:18px}
.fwarn{margin-top:14px}
.fwarn>*+*{margin-top:6px}
.sh{font-size:13px;font-weight:760;text-transform:uppercase;letter-spacing:.05em;color:var(--muted);margin:26px 0 6px}
.set-row{display:flex;align-items:center;gap:8px;padding:6px 0}
.set-row .inp{padding:9px 11px}
.set-row .short{width:64px;flex:none;text-align:center}
.set-row .tm{width:84px;flex:none;padding:8px 6px}
input[type=color]{width:36px;height:36px;border:0;padding:0;background:none;border-radius:9px;flex:none;cursor:pointer}
.choose{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-top:4px}
.choose button{background:var(--surface2);border-radius:14px;padding:16px 12px;display:flex;flex-direction:column;gap:6px;font-weight:700;font-size:15px}
.choose button .e{font-size:24px}
.choose button small{font-weight:500;color:var(--muted);font-size:12px}
ol.steps{padding-left:20px;margin:6px 0;font-size:13.5px}
ol.steps li{margin:4px 0}
code{background:var(--surface2);border-radius:5px;padding:1px 5px;font-size:12.5px}
.toast{position:fixed;left:50%;bottom:calc(152px + env(safe-area-inset-bottom));transform:translateX(-50%) translateY(16px);background:#242424;color:#fff;border-radius:13px;padding:11px 15px;font-size:14px;display:flex;gap:16px;align-items:center;opacity:0;pointer-events:none;transition:opacity .2s,transform .2s;z-index:80;box-shadow:0 8px 24px rgba(0,0,0,.28);max-width:calc(100% - 32px);width:max-content}
.toast.show{opacity:1;transform:translateX(-50%);pointer-events:auto}
.toast button{color:#8ab4ff;font-weight:750;flex:none}
@keyframes up{from{transform:translateY(40px);opacity:.3}}
@keyframes fade{from{opacity:0}}

/* Lehrgänge */
.camp-home{display:flex;align-items:center;gap:12px;margin-top:10px;cursor:pointer;background:color-mix(in srgb,#0891b2 9%,var(--surface));border-color:color-mix(in srgb,#0891b2 30%,transparent)}
.camp-home .ic{font-size:25px}
.campcard{cursor:pointer}
.campcard.now{border-color:color-mix(in srgb,#0891b2 45%,transparent);box-shadow:0 0 0 1px color-mix(in srgb,#0891b2 30%,transparent),var(--shadow)}
.campcard.past{opacity:.75}
.ct{font-size:18px;font-weight:760;letter-spacing:-.015em;margin:6px 0 2px}
.camp-hero .ct{font-size:22px}
.cstats{display:flex;flex-wrap:wrap;gap:6px 14px;margin-top:10px;font-size:13px;color:var(--muted)}
.cstats b{color:var(--text);font-size:15px}
.subjblock{margin-top:10px;border-left:4px solid var(--c);padding:12px}
.sbh{display:flex;align-items:center;gap:8px;font-size:16px}
.sbh .chip{margin-left:4px}
.sbm{display:flex;gap:12px;color:var(--muted);margin-top:2px}
.sbm span+span::before{content:"·";margin-right:12px}
.nachholen{margin-top:10px;background:var(--surface2);border-radius:11px;padding:10px 12px}
.nachholen .inp{background:var(--surface)}
.hwnotes{font-size:12.5px;color:var(--muted);margin-top:4px;white-space:pre-wrap;border-left:2px solid var(--line);padding-left:8px}
.campbadge{background:color-mix(in srgb,#0891b2 14%,transparent);color:#0e7490;border-radius:6px;padding:0 6px;font-weight:650}

/* Ablage */
.docrow{display:flex;align-items:center;gap:12px;background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:10px 12px;cursor:pointer;box-shadow:var(--shadow);min-width:0}
.dicon{width:42px;height:50px;border-radius:7px;display:grid;place-items:center;font-size:10.5px;font-weight:800;color:#fff;flex:none;letter-spacing:.03em}
.dicon.pdf{background:#e5484d}
.dicon.img{background:#0090ff}
.dn{font-weight:650;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.dm{font-size:12.5px;color:var(--muted);display:flex;flex-wrap:wrap;gap:0 6px;align-items:center;margin-top:2px}
.docview{background:var(--surface2);border-radius:12px;min-height:200px;max-height:62dvh;overflow:auto;padding:2px;text-align:center}
.docview canvas,.docview img{display:block;margin:0 auto 6px;max-width:none;box-shadow:0 1px 4px rgba(0,0,0,.18);background:#fff}
.docview img{max-width:100%}
.scanpages{display:grid;grid-template-columns:repeat(auto-fill,minmax(96px,1fr));gap:8px}
.spage{position:relative;aspect-ratio:3/4;border-radius:10px;overflow:hidden;background:var(--surface2);border:1px solid var(--line)}
.spage img{width:100%;height:100%;object-fit:cover}
.spage span{position:absolute;left:6px;bottom:6px;background:rgba(0,0,0,.6);color:#fff;border-radius:6px;font-size:11px;font-weight:700;padding:1px 6px}
.spage button{position:absolute;right:4px;top:4px;width:26px;height:26px;border-radius:50%;background:rgba(0,0,0,.6);color:#fff;font-size:17px;line-height:1;display:grid;place-items:center}
.spage.add{display:flex;flex-direction:column;align-items:center;justify-content:center;gap:4px;border:2px dashed var(--line);font-weight:650;font-size:12.5px;color:var(--muted);cursor:pointer}
.spage.add b{font-size:26px}
.morgen-card{background:color-mix(in srgb,#f76b15 8%,var(--surface));border-color:color-mix(in srgb,#f76b15 28%,transparent)}

/* Wochenansicht */
.weekgrid{display:flex;flex-direction:column;gap:8px}
.wkday{background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:8px 10px;min-width:0;box-shadow:var(--shadow)}
.wkday.we{background:var(--weekend)}
.wkday.fe{background:var(--ferien)}
.wkday.today{box-shadow:inset 0 0 0 2px var(--accent)}
.wkh{display:flex;align-items:baseline;gap:6px;cursor:pointer;margin-bottom:4px}
.wkh b{font-size:17px}
.wkh span{font-size:12px;color:var(--muted);font-weight:700}
.wkh .ls{margin-left:auto;font-weight:600}
.wev{display:flex;gap:6px;align-items:center;font-size:12.5px;font-weight:620;padding:4px 6px;border-radius:7px;background:color-mix(in srgb,var(--c) 14%,transparent);border-left:3px solid var(--c);margin-top:4px;cursor:pointer;min-width:0}
.wev .t{white-space:nowrap;overflow:hidden;text-overflow:ellipsis;min-width:0}
.wev .pill{font-size:9.5px}
.wkempty{font-size:12px;color:var(--muted)}

/* ---------- Tablet & Querformat ---------- */
:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
.tt .tc .in .fn{display:none}
@media (min-width: 700px){
  .gridcards{display:grid;grid-template-columns:repeat(auto-fill,minmax(330px,1fr));gap:12px;align-items:start}
  .gridcards>*{margin:0!important}
  .gridcards>.empty{grid-column:1/-1}
  .tt .tc .in .sn{display:none}
  .tt .tc .in .fn{display:block}
}
.cols2>*{min-width:0}
@media (min-width: 900px){
  main,.top-row,.subnav{max-width:1180px}
  .cols2{display:grid;grid-template-columns:minmax(0,1.05fr) minmax(0,1fr);gap:28px;align-items:start}
  .col-r>.sec:first-child{margin-top:12px}
  .weekgrid{display:grid;grid-template-columns:repeat(7,minmax(0,1fr))}
  .wkday{min-height:280px}
  .qa-row{grid-template-columns:repeat(4,1fr)}
  .sheet{max-width:680px}
  .stats .stat b{font-size:26px}
}
/* Seitenleiste statt Tab-Leiste: Tablet (breit) und Handy im Querformat */
@media (min-width: 900px), (orientation: landscape) and (max-height: 560px){
  body{padding-left:calc(86px + env(safe-area-inset-left))}
  .tabs{top:0;bottom:0;right:auto;left:0;width:calc(86px + env(safe-area-inset-left));grid-template-columns:1fr;grid-auto-rows:min-content;align-content:center;gap:6px;padding:calc(env(safe-area-inset-top) + 12px) 7px 12px calc(7px + env(safe-area-inset-left));border-top:0;border-right:1px solid var(--line)}
  .tab{padding:9px 0;border-radius:12px;font-size:11px}
  .tab.on{background:var(--accent-soft)}
  main{padding-bottom:calc(48px + env(safe-area-inset-bottom))}
  .fab{bottom:calc(22px + env(safe-area-inset-bottom));right:calc(22px + env(safe-area-inset-right))}
  .toast{bottom:calc(92px + env(safe-area-inset-bottom));left:calc(50% + 43px)}
}
@media (orientation: landscape) and (max-height: 560px){
  body{padding-left:calc(72px + env(safe-area-inset-left))}
  .tabs{width:calc(72px + env(safe-area-inset-left));gap:0;align-content:space-evenly;padding-top:calc(env(safe-area-inset-top) + 4px);padding-bottom:4px}
  .tab{font-size:9.5px;padding:3px 0}
  .tab svg{width:20px;height:20px}
  .top{padding-top:calc(env(safe-area-inset-top) + 6px);padding-right:calc(16px + env(safe-area-inset-right))}
  main{padding-right:calc(16px + env(safe-area-inset-right))}
  .hero{margin-bottom:6px}
  .hero .big{font-size:24px}
  .cell{min-height:56px}
  .cols2{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1fr);gap:18px;align-items:start}
  .gridcards{display:grid;grid-template-columns:repeat(auto-fill,minmax(300px,1fr));gap:10px;align-items:start}
  .gridcards>*{margin:0!important}
  .weekgrid{display:grid;grid-template-columns:repeat(7,minmax(0,1fr))}
  .wkday{min-height:170px;padding:6px}
  .sheet-wrap{align-items:center}
  .sheet{border-radius:18px;max-height:96dvh;max-width:660px}
  .fab{width:52px;height:52px}
  .toast{left:calc(50% + 36px)}
}

/* Druck (Stundenplan als PDF) */
@media print{
  .top,.tabs,.fab,.toast,.noprint,.subnav{display:none!important}
  body{background:#fff;color:#000;padding-left:0!important}
  main{padding:0;max-width:none}
  .ttwrap,.card{box-shadow:none;border-color:#999}
  .subjblock,.card{break-inside:avoid}
  .printtitle{display:block!important;font-size:18px;font-weight:700;margin:0 0 10px}
}
.printtitle{display:none}

<body>

</nav>

<input type="file" id="docIn" accept="application/pdf,image/*" multiple hidden>
<input type="file" id="camIn" accept="image/*" capture="environment" hidden>
<input type="file" id="galIn" accept="image/*" multiple hidden>

<script>
'use strict';
/* ==================================================================
   Lernplan (Realschule Bayern) – Version 4
   Läuft komplett im Browser. Daten: localStorage (+ optional GitHub-Sync).
   ================================================================== */

// ---------- Helfer ----------
const pad = n => String(n).padStart(2, '0');
const ds = d => d.getFullYear() + '-' + pad(d.getMonth() + 1) + '-' + pad(d.getDate());
const pd = s => { const [y, m, d] = s.split('-').map(Number); return new Date(y, m - 1, d); };
const addDays = (s, n) => { const d = pd(s); d.setDate(d.getDate() + n); return ds(d); };
const diffDays = (a, b) => Math.round((pd(b) - pd(a)) / 864e5);
const todayStr = () => ds(new Date());
const dow = s => pd(s).getDay();
const mondayOf = s => addDays(s, -((dow(s) + 6) % 7));
const esc = s => String(s ?? '').replace(/[&<>"']/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));
const uid = () => Date.now().toString(36) + Math.random().toString(36).slice(2, 8);
const $ = (s, r = document) => r.querySelector(s);
const WD = ['So', 'Mo', 'Di', 'Mi', 'Do', 'Fr', 'Sa'];

}

const nextFerien = d => FERIEN.find(f => f.start > d);
function prevFerien(d) { for (let i = FERIEN.length - 1; i >= 0; i--) if (FERIEN[i].end < d) return FERIEN[i]; return null; }
function freeRange(f) {

}

function apResult(jfn, s, m) { // Abschlussprüfung Realschule Bayern
  if (jfn == null || s == null) return null;
  let pn = s, note = '';
  if (m != null) { const comb = roundGrade((2 * s + m) / 3); if (comb < s) { pn = comb; note = 'mündliche Prüfung verbessert'; } }

// ---------- Ablage: Dateien lokal (IndexedDB) ----------
const FileDB = {
  _db: null,
  open() {
    if (this._db) return Promise.resolve(this._db);
    return new Promise((res, rej) => {
      const r = indexedDB.open('lernplan-dateien', 1);
      r.onupgradeneeded = () => { const d = r.result; if (!d.objectStoreNames.contains('files')) d.createObjectStore('files'); if (!d.objectStoreNames.contains('inbox')) d.createObjectStore('inbox'); };
      r.onsuccess = () => { this._db = r.result; res(this._db); };
      r.onerror = () => rej(r.error);
    });
  },
  async tx(store, mode, fn) {
    const d = await this.open();
    return new Promise((res, rej) => { const t = d.transaction(store, mode); const st = t.objectStore(store); const out = fn(st); t.oncomplete = () => res(out && out.result !== undefined ? out.result : out); t.onerror = () => rej(t.error); });
  },
  put(id, blob) { return this.tx('files', 'readwrite', st => st.put(blob, id)); },
  async get(id) { const d = await this.open(); return new Promise((res, rej) => { const r = d.transaction('files').objectStore('files').get(id); r.onsuccess = () => res(r.result || null); r.onerror = () => rej(r.error); }); },
  del(id) { return this.tx('files', 'readwrite', st => st.delete(id)); },
  async keys() { const d = await this.open(); return new Promise((res, rej) => { const r = d.transaction('files').objectStore('files').getAllKeys(); r.onsuccess = () => res(r.result || []); r.onerror = () => rej(r.error); }); },
  async inbox() { // von Android „Teilen“ übergebene Dateien (vom Service Worker abgelegt)
    const d = await this.open();
    return new Promise((res, rej) => {
      const t = d.transaction('inbox', 'readwrite'), st = t.objectStore('inbox'), out = [];
      const c = st.openCursor(); c.onsuccess = () => { const cur = c.result; if (cur) { out.push(cur.value); cur.delete(); cur.continue(); } };
      t.oncomplete = () => res(out); t.onerror = () => rej(t.error);
    });
  },
};

async function processImage(file, docMode) {
  const bmp = await createImageBitmap(file);
  const max = 2000, s = Math.min(1, max / Math.max(bmp.width, bmp.height));
  const w = Math.round(bmp.width * s), h = Math.round(bmp.height * s);
  const cv = document.createElement('canvas'); cv.width = w; cv.height = h;
  const ctx = cv.getContext('2d');
  ctx.fillStyle = '#fff'; ctx.fillRect(0, 0, w, h);
  if (docMode) ctx.filter = 'grayscale(1) contrast(1.45) brightness(1.08)';
  ctx.drawImage(bmp, 0, 0, w, h);
  const blob = await new Promise(r => cv.toBlob(r, 'image/jpeg', docMode ? 0.72 : 0.82));
  return { blob, w, h };
}
// Mini-PDF-Erzeuger: legt JPEG-Bilder als Seiten in eine PDF (A4)
async function pdfFromImages(imgs) {
  const enc = new TextEncoder(), parts = [], offs = []; let len = 0;

  obj(2, `<< /Type /Pages /Kids [${imgs.map((_, i) => (3 + 3 * i) + ' 0 R').join(' ')}] /Count ${n} >>`);
  for (let i = 0; i < n; i++) {
    const im = imgs[i], bytes = new Uint8Array(await im.blob.arrayBuffer());
    const W = 595.28, H = 841.89, sc = Math.min(W / im.w, H / im.h), dw = im.w * sc, dh = im.h * sc, x = (W - dw) / 2, y = (H - dh) / 2;
    obj(3 + 3 * i, `<< /Type /Page /Parent 2 0 R /MediaBox [0 0 ${W} ${H}] /Resources << /XObject << /Im${i} ${5 + 3 * i} 0 R >> >> /Contents ${4 + 3 * i} 0 R >>`);
    const cs = `q ${dw.toFixed(2)} 0 0 ${dh.toFixed(2)} ${x.toFixed(2)} ${y.toFixed(2)} cm /Im${i} Do Q`;
    obj(4 + 3 * i, `<< /Length ${cs.length} >>\nstream\n${cs}\nendstream`);
    obj(5 + 3 * i, [`<< /Type /XObject /Subtype /Image /Width ${im.w} /Height ${im.h} /ColorSpace /DeviceRGB /BitsPerComponent 8 /Filter /DCTDecode /Length ${bytes.length} >>\nstream\n`, bytes, '\nendstream']);
  }
  const total = 3 + 3 * n, xref = len;
  push(`xref\n0 ${total}\n0000000000 65535 f \n`);
  for (let id = 1; id < total; id++) push(String(offs[id]).padStart(10, '0') + ' 00000 n \n');
  push(`trailer\n<< /Size ${total} /Root 1 0 R >>\nstartxref\n${xref}\n%%EOF\n`);

}

// ---------- Dateien über GitHub synchronisieren ----------
const Files = {
  running: false, timer: null,
  schedule(ms = 3000) { if (!Sync.configured()) return; clearTimeout(this.timer); this.timer = setTimeout(() => this.run(), ms); },
  url(id) { return Sync.base() + '/contents/lernplan-dateien/' + id; },
  async run() {
    if (this.running || !Sync.configured() || !navigator.onLine) return;
    this.running = true;
    try {
      for (const d of db.docs.filter(x => !x.remote && LOCAL_FILES.has(x.id))) {
        if (d.size > 25 * 1048576) continue;
        const blob = await FileDB.get(d.id); if (!blob) continue;
        const b64 = await new Promise(r => { const fr = new FileReader(); fr.onload = () => r(String(fr.result).split(',')[1]); fr.readAsDataURL(blob); });
        let sha; const head = await fetch(this.url(d.id), { headers: Sync.headers(), cache: 'no-store' }); if (head.ok) sha = (await head.json()).sha;
        const r = await fetch(this.url(d.id), { method: 'PUT', headers: { ...Sync.headers(), 'Content-Type': 'application/json' }, body: JSON.stringify({ message: 'Lernplan-Datei ' + d.name, content: b64, ...(sha ? { sha } : {}) }) });
        if (!r.ok) throw new Error(await Sync.err(r));
        const cur = db.docs.find(x => x.id === d.id); if (cur) { upsert('docs', { ...cur, remote: true }); persist(); local.dirty = true; }
      }
      const dels = (local.fileDel || []).slice();
      for (const id of dels) {
        const h = await fetch(this.url(id), { headers: Sync.headers(), cache: 'no-store' });
        if (h.ok) { const sha = (await h.json()).sha; await fetch(this.url(id), { method: 'DELETE', headers: { ...Sync.headers(), 'Content-Type': 'application/json' }, body: JSON.stringify({ message: 'Lernplan-Datei gelöscht', sha }) }); }
        local.fileDel = (local.fileDel || []).filter(x => x !== id); saveLocal();
      }
      if (local.dirty) Sync.schedule(500);
    } catch (e) { local.sync.err = 'Dateien: ' + (e.message || e); saveLocal(); Sync.set('err'); }
    finally { this.running = false; }
  },
  async download(d) {
    try {
      const r = await fetch(this.url(d.id), { headers: { ...Sync.headers(), Accept: 'application/vnd.github.raw+json' }, cache: 'no-store' });
      if (!r.ok) return null;
      return new Blob([await r.arrayBuffer()], { type: d.type });
    } catch (e) { return null; }
  },
};

// Diagramm: Notenverlauf (1 oben = gut)
function lineChart(points, opts = {}) {
  if (!points.length) return '';
  const W = 340, H = 170, L = 26, R = 10, T = 12, B = 22;
  const xs = points.map(p => pd(p.date).getTime());
  const x0 = Math.min(...xs), x1 = Math.max(...xs), span = Math.max(1, x1 - x0);
  const X = t => points.length === 1 ? L + (W - L - R) / 2 : L + (t - x0) / span * (W - L - R);
  const Y = v => T + (v - 1) / 5 * (H - T - B);
  let g = '';
  for (let v = 1; v <= 6; v++) g += `<line class="gl" x1="${L}" x2="${W - R}" y1="${Y(v)}" y2="${Y(v)}"/><text class="ax" x="${L - 8}" y="${Y(v) + 3.5}" text-anchor="end">${v}</text>`;
  const first = points[0].date, last = points[points.length - 1].date;
  g += `<text class="ax" x="${L}" y="${H - 5}">${fmtDM(first)}</text>`;
  if (points.length > 1) g += `<text class="ax" x="${W - R}" y="${H - 5}" text-anchor="end">${fmtDM(last)}</text>`;
  if (opts.avg != null) g += `<line class="avgl" x1="${L}" x2="${W - R}" y1="${Y(opts.avg)}" y2="${Y(opts.avg)}"/><text class="ax" x="${W - R}" y="${Y(opts.avg) - 4}" text-anchor="end">Ø ${fmtNum(opts.avg)}</text>`;
  if (points.length > 1) g += `<polyline class="ln" points="${points.map((p, i) => X(xs[i]) + ',' + Y(p.v)).join(' ')}"/>`;
  points.forEach((p, i) => {
    const x = X(xs[i]), y = Y(p.v);
    g += `<circle class="pt${p.big ? ' big' : ''}" cx="${x}" cy="${y}" r="${p.big ? 5 : 4.5}"/>`;
    g += `<circle class="hit" cx="${x}" cy="${y}" r="14" data-tip="${esc(p.tip)}"/>`;
  });
  return `<svg class="chart" viewBox="0 0 ${W} ${H}" role="img" aria-label="${esc(opts.label || 'Notenverlauf')}">${g}</svg>`;
}

function campStatus(c) {
  const t = todayStr(), end = c.end || c.start;

  if (t > end) return { k: 'past', txt: 'vorbei' };
  return { k: 'now', txt: 'Tag ' + (diffDays(c.start, t) + 1) + ' von ' + (diffDays(c.start, end) + 1) };
}
const campTasks = id => db.homework.filter(h => h.campId === id);

async function showDocContent() {
  const d = formState, el = $('#docView'); if (!el || !d) return;
  const blob = await docBlob(d);
  if (!$('#docView')) return;
  if (!blob) { el.innerHTML = `<div class="warn">⚠️<div>Die Datei ist auf diesem Gerät nicht gespeichert${d.remote ? ' und konnte gerade nicht geladen werden (offline?)' : ''}.</div></div>`; return; }
  if (viewerURL) URL.revokeObjectURL(viewerURL); viewerURL = URL.createObjectURL(blob);
  if (!isPdf(d)) { el.innerHTML = `<img src="${viewerURL}" alt="${esc(d.name)}" style="width:${Math.round(100 * viewerZoom)}%">`; return; }
  el.innerHTML = '<div class="empty">PDF wird angezeigt …</div>';
  try {
    const lib = await loadPdfJs();
    const pdf = await lib.getDocument({ data: new Uint8Array(await blob.arrayBuffer()) }).promise;
    if (!$('#docView')) return;
    el.innerHTML = '';
    const w = Math.max(280, el.clientWidth - 4), dpr = Math.min(2, window.devicePixelRatio || 1);
    for (let i = 1; i <= pdf.numPages; i++) {
      const page = await pdf.getPage(i), vp0 = page.getViewport({ scale: 1 });
      const vp = page.getViewport({ scale: (w / vp0.width) * viewerZoom * dpr });
      const cv = document.createElement('canvas'); cv.width = vp.width; cv.height = vp.height; cv.style.width = (vp.width / dpr) + 'px';
      if (!el.isConnected) return; el.appendChild(cv);
      await page.render({ canvasContext: cv.getContext('2d'), viewport: vp }).promise;
    }
  } catch (e) { el.innerHTML = `<div class="warn">⚠️<div>${esc(e.message || 'PDF konnte nicht angezeigt werden.')} Tippe auf „Teilen / Öffnen mit …“, um sie in einer anderen App zu öffnen.</div></div>`; }
}

function planItems(eid) { return db.homework.filter(h => h.planFor === eid); }
function openPlanGen(eid) {
  const e = db.events.find(x => x.id === eid); if (!e) return;
  const t = todayStr(), ls = learnStart(e);
  const topics = (e.notes || '').split(/\n|;|,(?![^(]*\))/).map(s => s.replace(/^[-•*\d.)\s]+/, '').trim()).filter(s => s.length > 1);
  const ret = sheetOpen ? reopener() : null;
  formState = { _plan: true, eventId: eid, topics: topics.join('\n'), start: ls > t && ls < e.date ? ls : t, min: 30, weekends: true, skipExams: true, skipCamps: false };
  sheetReturn = ret;

function planDays(f, e) {
  const days = [];
  for (let d = f.start; d < e.date; d = addDays(d, 1)) {
    const w = dow(d);
    if (!f.weekends && (w === 0 || w === 6)) continue;
    if (f.skipExams && allEvents().some(x => x.id !== e.id && isExam(x) && x.date === d)) continue;
    if (f.skipCamps && campOn(d).length) continue;
    days.push(d);
  }
  return days;
}
function planBuild(f, e) {
  const days = planDays(f, e);
  let topics = f.topics.split('\n').map(s => s.trim()).filter(Boolean);
  if (!topics.length) topics = ['Stoff wiederholen'];
  if (!days.length) return [];
  if (days.length === 1) return [{ date: days[0], text: 'Alles wiederholen: ' + topics.join(', ') }];
  const study = days.slice(0, -1), out = [];
  if (topics.length <= study.length) topics.forEach((tp, i) => out.push({ date: study[Math.floor(i * study.length / topics.length)], text: tp }));
  else { const per = Math.ceil(topics.length / study.length); study.forEach((d, i) => { const chunk = topics.slice(i * per, (i + 1) * per); if (chunk.length) out.push({ date: d, text: chunk.join(', ') }); }); }
  out.push({ date: days[days.length - 1], text: 'Generalprobe: alles wiederholen & Probeaufgaben', final: true });
  return out;
}

    if (['nächsten', 'nächste', 'naechsten', 'naechste', 'kommenden', 'kommende'].includes(w)) { nextWeek = true; used[i] = true; continue; }

const Sync = {
  state: 'off', running: false, again: false, timer: null,
  configured() { const s = local.sync; return !!(s && s.owner && s.repo && s.token); },
  base() { const s = local.sync; return `https://api.github.com/repos/${encodeURIComponent(s.owner)}/${encodeURIComponent(s.repo)}`; },
  path() { return (local.sync.path || 'lernplan-daten.json').replace(/^\/+/, ''); },
  headers() { return { Authorization: 'Bearer ' + local.sync.token.trim(), Accept: 'application/vnd.github+json', 'X-GitHub-Api-Version': '2022-11-28' }; },
  async err(r) {
    let m = ''; try { m = (await r.json()).message || ''; } catch (e) { /* */ }
    if (r.status === 401) return 'Token ungültig oder abgelaufen';
    if (r.status === 403) return 'Keine Berechtigung – der Token braucht „Contents: Read and write“' + (m ? ' (' + m + ')' : '');
    if (r.status === 404) return 'Repository nicht gefunden – Name prüfen und ob der Token Zugriff darauf hat';
    return 'GitHub-Fehler ' + r.status + (m ? ': ' + m : '');
  },
  async testRepo() { const r = await fetch(this.base(), { headers: this.headers(), cache: 'no-store' }); if (!r.ok) throw new Error(await this.err(r)); return r.json(); },
  async get() {
    const r = await fetch(this.base() + '/contents/' + this.path() + '?t=' + Date.now(), { headers: this.headers(), cache: 'no-store' });
    if (r.status === 404) {
      await this.testRepo();
      if (!local.sync.path) { // alte Datei aus früherer Version übernehmen
        const o = await fetch(this.base() + '/contents/schulplaner-daten.json?t=' + Date.now(), { headers: this.headers(), cache: 'no-store' });
        if (o.ok) { const j = await o.json(); if (j.content) return { data: JSON.parse(b64dec(j.content)), sha: null }; }
      }
      return { data: null, sha: null };
    }
    if (!r.ok) throw new Error(await this.err(r));
    const j = await r.json();
    let content = j.content;
    if (!content && j.git_url) { const b = await fetch(j.git_url, { headers: this.headers(), cache: 'no-store' }); content = (await b.json()).content; }

  async put(data, sha) {

    const r = await fetch(this.base() + '/contents/' + this.path(), { method: 'PUT', headers: { ...this.headers(), 'Content-Type': 'application/json' }, body: JSON.stringify(body) });

      if (manual) toast('Sync-Fehler: ' + local.sync.err);

function mergeDb(a, b) {
  const del = { ...(b.deleted || {}) };
  for (const [k, t] of Object.entries(a.deleted || {})) del[k] = Math.max(del[k] || 0, t);
  const out = { v: 2, deleted: {} };
  for (const c of COLLS) {
    const m = new Map();
    (b[c] || []).forEach(x => m.set(x.id, x));
    (a[c] || []).forEach(x => { const y = m.get(x.id); if (!y || (x.u || 0) >= (y.u || 0)) m.set(x.id, x); });
    out[c] = [...m.values()].filter(x => !(del[x.id] != null && del[x.id] >= (x.u || 0)));

  out.settings = { ...defaults().settings, ...(((a.settings?.u || 0) >= (b.settings?.u || 0)) ? a.settings : b.settings) };

    const maxY = +FERIEN[FERIEN.length - 1].end.slice(0, 4);

    case 'campOpen': if (sheetOpen) { sheetReturn = null; closeSheet(); } ui.view = 'lehrgang'; ui.camp = v; ui.campFilter = 'alle'; render(); window.scrollTo(0, 0); break;
    case 'campBack': ui.camp = null; render(); window.scrollTo(0, 0); break;
    case 'campNew': openCamp(null); break;
    case 'campEdit': { const c = db.camps.find(x => x.id === v); if (c) openCamp(c); break; }
    case 'campDel': deleteCamp(f.id); break;
    case 'ckind': f.kind = v; $('#ff').innerHTML = campFieldsHTML(); break;
    case 'campFilter': ui.campFilter = v; render(); break;
    case 'allCamps': ui.allCamps = !ui.allCamps; render(); break;
    case 'campTaskAdd': { const c = db.camps.find(x => x.id === ui.camp); openHw(null, { campId: ui.camp, subject: v, due: c ? nextSchoolDay(c.end || c.start) : '' }); break; }
    case 'hwSaveNext': saveHw(true); break;
    case 'hAllSubj': f._allSubj = true; $('#ff').innerHTML = hwFieldsHTML(); break;
    case 'hwHanded': { const h = db.homework.find(x => x.id === v); if (h) { h.handed = !h.handed; upsert('homework', h); save(); render(); } break; }
    case 'ckToggle': campUpdate(ui.camp, c => { const x = (c.checklist || []).find(y => y.id === v); if (x) x.d = !x.d; }); render(); break;
    case 'ckDel': campUpdate(ui.camp, c => { c.checklist = (c.checklist || []).filter(y => y.id !== v); }); render(); break;
    case 'ckAdd': { const inp = $('#ckNew'), t2 = inp.value.trim(); if (!t2) { inp.focus(); break; } campUpdate(ui.camp, c => { c.checklist = (c.checklist || []).concat([{ id: 'k' + uid(), t: t2, d: false }]); }); render(); break; }
    case 'noteOpen': ui.noteOpen = v; render(); setTimeout(() => document.querySelector(`[data-mnote="${v}"]`)?.focus(), 50); break;
    case 'campShare': { const c = db.camps.find(x => x.id === ui.camp); if (c) shareCamp(c); break; }
    case 'nachschreiben': nachschreiben(v); break;
    // Ablage
    case 'docOpen': openDoc(v); break;
    case 'docAdd': pendingAttach = {}; $('#docIn').click(); break;
    case 'scanNew': openScan({ subject: ui.docSubj && !['all', 'none'].includes(ui.docSubj) ? ui.docSubj : '' }); break;
    case 'docSubj': ui.docSubj = v; render(); break;
    case 'docsForSubj': sheetReturn = null; closeSheet(); ui.view = 'aufgaben'; ui.auf = 'ablage'; ui.docSubj = v; render(); break;
    case 'attScan': { const [key, id, sid] = v.split(':'); openScan({ [key]: id, subject: sid || (key === 'hwId' || key === 'eventId' ? (formState && formState.subject) || '' : '') }); break; }
    case 'attFile': { const [key, id, sid] = v.split(':'); pendingAttach = { [key]: id, subject: sid || (formState && formState.subject) || '' }; $('#docIn').click(); break; }
    case 'scanCam': $('#camIn').click(); break;
    case 'scanGal': $('#galIn').click(); break;
    case 'scanDel': { const i = +v; URL.revokeObjectURL(f.pages[i].url); f.pages.splice(i, 1); f.originals.splice(i, 1); openSheet(scanHTML(), 'scan'); break; }
    case 'scanSubj': f.subject = v; openSheet(scanHTML(), 'scan'); break;
    case 'scanSave': a.disabled = true; scanSave(); break;
    case 'docZoom': viewerZoom = Math.min(3, Math.max(0.6, viewerZoom + (+v) * 0.4)); showDocContent(); break;
    case 'docShare': shareDoc(); break;
    case 'docDownload': docBlob(f).then(b => b && downloadBlob(f.name, b)); break;
    case 'docSave': saveDocMeta(); break;
    case 'docSubjSet': f.subject = v; $('.sheet').querySelectorAll('[data-a=docSubjSet]').forEach(b => b.classList.toggle('on', b.dataset.v === v)); break;
    case 'docDel': if (confirm(`„${f.name}“ löschen?`)) { const id = f.id; deleteDoc(id).then(() => { const ret = sheetReturn; sheetReturn = null; if (ret) { formState = null; ret(); const ff = $('#ff'); if (ff && sheetMode === 'hw') ff.innerHTML = hwFieldsHTML(); if (ff && sheetMode === 'form') renderFormFields(); } else { closeSheet(); render(); } toast('Datei gelöscht'); }); } break;
    // Lernplan-Generator & Morgen
    case 'planGen': e.stopPropagation(); openPlanGen(v); break;
    case 'planGenForm': { if (!db.events.some(x => x.id === f.id)) { toast('Bitte den Termin zuerst speichern'); break; } openPlanGen(f.id); break; }
    case 'planDo': planDo(); break;
    case 'goMorgen': ui.view = 'morgen'; render(); window.scrollTo(0, 0); break;
    case 'packToggle': case 'packAll': {
      const d = tomorrowDay(); local.pack = local.pack || {}; const p = local.pack[d] = local.pack[d] || {};
      if (act === 'packAll') [...new Set(lessonsOn(d).map(l => l.subject))].forEach(s => p[s] = true); else p[v] = !p[v];
      Object.keys(local.pack).forEach(k => { if (k < todayStr()) delete local.pack[k]; }); saveLocal(); render(); break;
    }
    // Speichern je nach Formular
    case 'save':
      if (sheetMode === 'camp') { saveCamp(); break; }
      if (sheetMode === 'form') saveForm(); else if (sheetMode === 'hw') saveHw(); else if (sheetMode === 'grade') saveGrade();
      else if (sheetMode === 'subjEdit') saveSubj(); else if (sheetMode === 'tt') saveTT(); else if (sheetMode === 'abs') saveAbs(); else if (sheetMode === 'study') saveStudy();
      break;
    case 'doImport': doImport(); break;
    // Einstellungen
    case 'theme': local.theme = v; saveLocal(); applyTheme(); refreshSettings(); break;
    case 'install': if (deferredPrompt) { deferredPrompt.prompt(); deferredPrompt.userChoice.finally(() => { deferredPrompt = null; refreshSettings(); if (!sheetOpen) render(); }); } break;
    case 'gtAdd': { const inp = $('#newGt'), name = inp.value.trim(); if (!name) { inp.focus(); break; } upsert('gradeTypes', { id: 'gt' + uid(), name, short: name.slice(0, 4), w: 1 }); save(); refreshSettings(); break; }
    case 'gtDel': { const n = db.grades.filter(g => g.type === v).length; if (n) { toast(`Wird von ${n} Noten verwendet – erst diese ändern`); break; } if (db.gradeTypes.length <= 1) break; removeItem('gradeTypes', v); save(); refreshSettings(); break; }
    case 'syncConnect': {
      const s = local.sync = { ...(local.sync || {}) };
      document.querySelectorAll('[data-sync]').forEach(i => s[i.dataset.sync] = i.value.trim());
      if (!s.owner || !s.repo || !s.token) { toast('Bitte Name, Repository und Token ausfüllen'); break; }
      a.disabled = true; a.textContent = 'Verbinde …';
      Sync.testRepo().then(r => { if (!r.private && !confirm('Achtung: Dieses Repository ist ÖFFENTLICH – deine Noten wären für alle sichtbar. Trotzdem verwenden?')) throw new Error('abgebrochen'); saveLocal(); return Sync.run(true); })
        .catch(err => { toast(String(err.message || err)); }).finally(() => refreshSettings());
      break;
    }
    case 'syncNow': Sync.run(true); break;
    case 'syncCode': { const code = syncCode(); (navigator.clipboard ? navigator.clipboard.writeText(code) : Promise.reject()).then(() => toast('Code kopiert – auf dem 2. Gerät unter Einstellungen einfügen. Enthält deinen Token, nur privat weitergeben!')).catch(() => prompt('Verbindungscode (privat halten!):', code)); break; }
    case 'syncCodeUse': {
      const raw = ($('#syncCodeIn').value || '').trim();
      try { if (!raw.startsWith('SP1.')) throw 0; const j = JSON.parse(unb64url(raw.slice(4))); local.sync = { owner: j.o, repo: j.r, token: j.t, path: j.p || '' }; saveLocal(); Sync.run(true).finally(() => refreshSettings()); }
      catch (err) { toast('Ungültiger Code'); }
      break;
    }
    case 'syncOff': if (confirm('Synchronisierung auf diesem Gerät beenden? Deine Daten bleiben hier und auf GitHub erhalten.')) { local.sync = {}; saveLocal(); Sync.set('off'); refreshSettings(); } break;
    case 'remToggle': enableReminders(a.checked); break;
    case 'remTest': navigator.serviceWorker?.ready.then(reg => reg.showNotification('Lernplan', { body: 'So sehen deine Erinnerungen aus 👍', icon: 'icon-192.png', badge: 'icon-192.png' })).catch(() => toast('Test nicht möglich')); break;
    case 'ferienUpd': updateFerienOnline(true); updateSchuldaten(); break;
    case 'backup': download('lernplan-backup-' + todayStr() + '.json', JSON.stringify(db, null, 1), 'application/json'); toast('Backup gespeichert'); break;
    case 'restore': $('#restoreFile').click(); break;
    case 'exportIcs': download('lernplan-termine.ics', buildICS(true, false), 'text/calendar'); break;
    case 'exportFerien': download('ferien-bayern.ics', buildICS(false, true), 'text/calendar'); break;
    case 'reset':
      if (confirm('Wirklich ALLE Daten löschen (Termine, Noten, Stundenplan, Aufgaben …)? Speichere vorher ein Backup.') && confirm('Ganz sicher? Das lässt sich nicht rückgängig machen.')) {
        const fresh = defaults(); COLLS.forEach(c => db[c].forEach(x => { if (!fresh[c].some(y => y.id === x.id)) db.deleted[x.id] = Date.now(); }));
        const del = db.deleted; db = fresh; db.deleted = del; db.settings.u = Date.now(); save(); FileDB.keys().then(ks => ks.forEach(k => FileDB.del(k))).catch(() => {}); LOCAL_FILES = new Set(); closeSheet(); render(); toast('Alle Daten gelöscht');
      }
      break;
  }
});

// ---------- Eingaben ----------
document.addEventListener('input', e => {
  const el = e.target, f = formState, k = el.dataset.f;
  if (k === 'search') { ui.search = el.value; $('#listRes').innerHTML = listResHTML(); return; }
  if (k === 'docsearch') { ui.docSearch = el.value; const pos = el.selectionStart; render(); const n = $('[data-f=docsearch]'); if (n) { n.focus(); n.setSelectionRange(pos, pos); } return; }
  if (f && f._scan && k === 'scanname') { f.name = el.value; return; }
  if (f && f._doc && (k === 'docname' || k === 'docnotes')) { f[k === 'docname' ? 'name' : 'notes'] = el.value; return; }
  if (f && f._plan && k === 'pltopics') { f.topics = el.value; clearTimeout(window._plT); window._plT = setTimeout(() => { const ta = $('[data-f=pltopics]'), pos = ta.selectionStart; openSheet(planGenHTML(), 'plangen'); const n = $('[data-f=pltopics]'); n.focus(); n.setSelectionRange(pos, pos); }, 700); return; }
  if (el.dataset.sync) { local.sync = { ...(local.sync || {}), [el.dataset.sync]: el.value.trim() }; saveLocal(); return; }
  if (el.dataset.gt) { const t = db.gradeTypes.find(x => x.id === el.dataset.id); if (t) { t[el.dataset.gt] = el.dataset.gt === 'w' ? +el.value : el.value; if (el.dataset.gt === 'name') t.short = t.short || el.value.slice(0, 4); upsert('gradeTypes', t); save(); } return; }
  if (el.dataset.per) { const P = db.settings.periods.map(p => ({ ...p })); P[+el.dataset.i][el.dataset.per] = el.value; setSetting('periods', P); save(); return; }
  if (el.dataset.ap) {
    const v = el.value.replace(/[^1-6]/g, '').slice(0, 1); el.value = v;
    const id = 'ap-' + ui.sy + '-' + el.dataset.id, x = db.ap.find(y => y.id === id) || { id, s: '', m: '' };
    x[el.dataset.ap] = v; upsert('ap', x); save(); render();
    const again = document.querySelector(`[data-ap="${el.dataset.ap}"][data-id="${el.dataset.id}"]`); if (again) { again.focus(); again.setSelectionRange?.(1, 1); }
    return;
  }
  if (!f || !k) return;
  switch (k) {
    case 'qa': {
      const r = parseQuick(el.value);
      ['type', 'subject', 'date', 'time'].forEach(x => { if (r[x]) f[x] = r[x]; });
      if (r.title) { f.title = r.title; f._qaTitle = r.title; } else if (f._qaTitle && f.title === f._qaTitle) f.title = '';
      renderQaPreview(r); renderFormFields(); return;
    }
    case 'title': case 'time': case 'notes': case 'prep': case '_grade': f[k] = el.value; return;
    case 'date': case 'end': f[k] = el.value; if (k === 'date' && f.end && f.end <= f.date) f.end = addDays(f.date, 1); $('#fwarn').innerHTML = warnHTML(); return;
    case 'hwtext': {
      f.text = el.value;
      if (f._new) {
        const r = parseQuick(el.value, { hw: true }); let ch = false;
        if (r.subject && !f._manualSubj && f.subject !== r.subject) { f.subject = r.subject; ch = true; }
        if (r.date && !f._manualDue && f.due !== r.date) { f.due = r.date; ch = true; }
        renderQaPreview({ subject: r.subject, date: r.date }, $('#hwPrev'));
        if (ch) $('#ff').innerHTML = hwFieldsHTML();
      }
      return;
    }
    case 'hdue': f.due = el.value; f._manualDue = true; return;
    case 'hpage': f.page = el.value; return;
    case 'hnotes': f.notes = el.value; return;
    case 'ctitle': f.title = el.value; return;
    case 'cplace': f.place = el.value; return;
    case 'cnotes': f.notes = el.value; return;
    case 'cstart': case 'cend': f[k === 'cstart' ? 'start' : 'end'] = el.value; if (f.end && f.end < f.start) f.end = f.start; $('#ff').innerHTML = campFieldsHTML(); return;
    case 'gdate': f.date = el.value; return;
    case 'gnote': f.note = el.value; return;
    case 'sname': f.name = el.value; return;
    case 'sshort': f.short = el.value; return;
    case 'steacher': f.teacher = el.value; return;
    case 'sroom': f.room = el.value; return;
    case 'scolor': f.color = el.value; return;
    case 'troom': f.room = el.value; return;
    case 'adate': f.date = el.value; if (!f.end) { f.lessons = lessonsOn(f.date).length || f.lessons; } $('#ff').innerHTML = absFieldsHTML(); return;
    case 'aend': f.end = el.value; return;
    case 'alessons': f.lessons = el.value; return;
    case 'anote': f.note = el.value; return;
    case 'ldate': f.date = el.value; return;
    case 'lmin': f.min = el.value; return;
  }
});
document.addEventListener('change', e => {
  const el = e.target, f = formState, k = el.dataset.f;
  if (k === 'sy') { ui.sy = el.value; render(); return; }
  if (f && f._scan && k === 'scanmode') { f.docMode = el.checked; if (f.originals.length) scanReprocess(); return; }
  if (f && f._doc && ['dochw', 'docev', 'doccamp'].includes(k)) { f[{ dochw: 'hwId', docev: 'eventId', doccamp: 'campId' }[k]] = el.value; if (k === 'dochw' && el.value && !f.subject) f.subject = (db.homework.find(x => x.id === el.value) || {}).subject || ''; return; }
  if (f && f._plan && ['plstart', 'plmin', 'plwe', 'plex', 'plcamp'].includes(k)) { if (k === 'plstart') f.start = el.value || f.start; else if (k === 'plmin') f.min = +el.value; else f[{ plwe: 'weekends', plex: 'skipExams', plcamp: 'skipCamps' }[k]] = el.checked; openSheet(planGenHTML(), 'plangen'); return; }
  if (el.dataset.mdone != null) { const sid = el.dataset.mdone; campUpdate(ui.camp, c => { c.missed = c.missed || {}; c.missed[sid] = { ...(c.missed[sid] || {}), done: el.checked }; }); render(); return; }
  if (el.dataset.mnote != null) { const sid = el.dataset.mnote; campUpdate(ui.camp, c => { c.missed = c.missed || {}; c.missed[sid] = { ...(c.missed[sid] || {}), note: el.value.trim() }; }); return; }
  if (k === 'target' || k === 'targetType') { const key = k === 'target' ? 'target' : 'targetType'; local[key] = { ...(local[key] || {}), [el.dataset.id]: k === 'target' ? +el.value : el.value }; saveLocal(); openSubject(el.dataset.id); return; }
  if (el.dataset.s) {
    const key = el.dataset.s;
    setSetting(key, el.type === 'checkbox' ? el.checked : (isNaN(+el.value) ? el.value : +el.value));
    if (key === 'mariae') HOL = {};
    save(); EVI = null; return;
  }
  if (k === 'days6') { setSetting('days', el.checked ? 6 : 5); save(); return; }
  if (k === 'abon') { setSetting('ab', { ...db.settings.ab, on: el.checked }); save(); ui.ttWeek = null; openPeriods(); return; }
  if (!f || !k) return;
  if (k === 'multi') { f.end = el.checked ? addDays(f.date, 1) : ''; renderFormFields(); }
  else if (k === 'done') f.done = el.checked;
  else if (k === 'svr') f.vr = el.checked;
  else if (k === 'sap') f.ap = el.checked;
  else if (k === 'tdouble') f._double = el.checked;
  else if (k === 'amulti') { f.end = el.checked ? addDays(f.date, 1) : ''; $('#ff').innerHTML = absFieldsHTML(); }
  else if (k === 'aexc') f.excused = el.checked;
  else if (k === 'cabs') f.absence = el.checked;
  else if (k === 'ttrepl') f._replace = el.checked;
  else if (k === 'tttimes') f._times = el.checked;
  else if (k === 'cexc') f.excused = el.checked;
  else if (k === 'hkindsel') f.kind = el.value;
  else if (k === 'hcamp') { f.campId = el.value; $('#ff').innerHTML = hwFieldsHTML(); }
  else if (k === 'hdone') f.done = el.checked;
  else if (k === 'hhanded') { f.handed = el.checked; if (el.checked) f.done = true; }
});
document.addEventListener('keydown', e => {
  if (e.key === 'Enter' && e.target.matches('.ev,.next')) { e.target.click(); return; }
  if (e.key === 'Enter' && e.target.id === 'qa') { e.preventDefault(); saveForm(); return; }
  if (e.key === 'Enter' && e.target.id === 'ckNew') { e.preventDefault(); $('[data-a="ckAdd"]').click(); return; }
  if (e.key === 'Enter' && e.target.id === 'newGt') { e.preventDefault(); $('[data-a="gtAdd"]').click(); return; }
  if (e.key === 'Escape' && sheetOpen) { closeSheet(); return; }
  if (sheetOpen) { if ((e.metaKey || e.ctrlKey) && e.key === 'Enter') $('.sheet [data-a="save"]')?.click(); return; }
  if (e.target.matches('input,textarea,select') || e.metaKey || e.ctrlKey || e.altKey) return;
  const kk = e.key.toLowerCase();
  if (kk === 'n') { e.preventDefault(); fabAction(); }
  else if (kk === 't') { ui.cursor = todayStr(); render(); }
  else if (kk >= '1' && kk <= '6') { ui.view = ['heute', 'kalender', 'plan', 'aufgaben', 'lehrgang', 'noten'][+kk - 1]; render(); }
  else if (e.key === 'ArrowLeft') shift(-1);
  else if (e.key === 'ArrowRight') shift(1);
});
$('#sheet').addEventListener('click', e => { if (e.target.id === 'sheet') { sheetReturn = null; closeSheet(); } });
$('#docIn').addEventListener('change', async e => { const files = [...e.target.files]; e.target.value = ''; if (!files.length) return; const link = pendingAttach || {}; pendingAttach = null; await addFilesTo(files, link); const ff = $('#ff'); if (sheetOpen && ff && sheetMode === 'hw') ff.innerHTML = hwFieldsHTML(); else if (sheetOpen && ff && sheetMode === 'form') renderFormFields(); else if (!sheetOpen) render(); });
['camIn', 'galIn'].forEach(idn => $('#' + idn).addEventListener('change', e => { const files = [...e.target.files]; e.target.value = ''; if (files.length) scanAddFiles(files); }));
$('#ttFile').addEventListener('change', e => { const file = e.target.files[0]; if (file && formState) ttReadFile(file); e.target.value = ''; });
$('#restoreFile').addEventListener('change', e => {
  const file = e.target.files[0]; if (!file) return;
  const r = new FileReader();
  r.onload = () => {
    try {
      const d = JSON.parse(r.result); if (!d || !Array.isArray(d.events)) throw new Error();
      if (!confirm('Backup laden? Die aktuellen Daten werden ersetzt.')) return;
      const old = db; db = migrate(d); db.deleted = { ...(db.deleted || {}) };
      COLLS.forEach(c => old[c].forEach(x => { if (!db[c].some(y => y.id === x.id)) db.deleted[x.id] = Date.now(); }));
      COLLS.forEach(c => db[c].forEach(x => x.u = Date.now())); db.settings.u = Date.now();
      HOL = {}; save(); closeSheet(); render(); toast('Backup geladen ✓');
    } catch (err) { toast('Die Datei ist kein gültiges Backup'); }
  };
  r.readAsText(file); e.target.value = '';
});
(() => { // Wischen im Kalender
  let x0 = null, y0 = null; const v = $('#view');
  v.addEventListener('touchstart', e => { if (e.touches.length === 1) { x0 = e.touches[0].clientX; y0 = e.touches[0].clientY; } }, { passive: true });
  v.addEventListener('touchend', e => {
    if (x0 == null) return;
    const dx = e.changedTouches[0].clientX - x0, dy = e.changedTouches[0].clientY - y0; x0 = null;
    if (ui.view === 'kalender' && Math.abs(dx) > 60 && Math.abs(dx) > Math.abs(dy) * 1.5) shift(dx < 0 ? 1 : -1);
  }, { passive: true });
})();
let lastVis = Date.now();
document.addEventListener('visibilitychange', () => {
  if (document.hidden) return;
  if (!sheetOpen) render();
  if (Date.now() - lastVis > 30000) { Sync.run(); updateSchuldaten(); showDueReminders(); navigator.serviceWorker?.getRegistration().then(r => r?.update()).catch(() => {}); }
  lastVis = Date.now();
});
window.addEventListener('online', () => Sync.run());
matchMedia('(prefers-color-scheme: dark)').addEventListener?.('change', applyTheme);
window.addEventListener('beforeinstallprompt', e => { e.preventDefault(); deferredPrompt = e; if (!sheetOpen) render(); });
window.addEventListener('appinstalled', () => { deferredPrompt = null; toast('Installiert – viel Erfolg im Schuljahr!'); render(); });

// ---------- Start ----------
$('#btnPrev').innerHTML = ICON.left; $('#btnNext').innerHTML = ICON.right;
$('#btnSettings').innerHTML = ICON.sliders; $('#fab').innerHTML = ICON.plus;
document.querySelectorAll('.tab .i').forEach((el, i) => { el.outerHTML = [ICON.home, ICON.month, ICON.plan, ICON.tasks, ICON.sled, ICON.grades][i]; });
applyTheme(); buildFerien();
const params = new URLSearchParams(location.search);
const vParam = params.get('v');
if (vParam === 'monat') { ui.view = 'kalender'; ui.kal = 'monat'; } else if (['kalender', 'plan', 'aufgaben', 'noten', 'lehrgang', 'morgen'].includes(vParam)) ui.view = vParam;
if (vParam === 'ablage') { ui.view = 'aufgaben'; ui.auf = 'ablage'; }
if (local.timer) { /* laufender Timer bleibt erhalten */ }
persist(); render();
refreshLocalFiles().then(() => { if (!sheetOpen) render(); handleSharedInbox(); Files.schedule(2500); });
if (params.get('scan') === '1') openScan({});
if (params.get('neu') === '1') openForm(null);
if (params.get('aufgabe') === '1') openHw(null);
if (params.get('import')) { const p = params.get('import'); history.replaceState(null, '', location.pathname); openImport(p); }
if ('serviceWorker' in navigator && location.protocol.startsWith('http')) {
  const hadCtrl = !!navigator.serviceWorker.controller;
  navigator.serviceWorker.register('sw.js').then(reg => {
    reg.addEventListener('updatefound', () => {
      const nw = reg.installing;
      nw?.addEventListener('statechange', () => { if (nw.state === 'activated' && hadCtrl) toast('Neue Version installiert', 'Neu laden', () => location.reload()); });
    });
  }).catch(() => {});
}
if (navigator.storage && navigator.storage.persist) navigator.storage.persist().catch(() => {});
Sync.set(Sync.configured() ? (local.sync.err ? 'err' : 'ok') : 'off');
Sync.run(); updateFerienOnline(false); updateSchuldaten(); scheduleReminders(); showDueReminders();
setInterval(() => { if (!sheetOpen && (ui.view === 'heute' || ui.view === 'plan') && !document.hidden) render(); }, 60000);
</script>
