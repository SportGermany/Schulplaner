<html lang="de">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#2343b8">

<style>:root{padding-top:env(safe-area-inset-top,0px)}body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);z-index:10;background:var(--bg)}</style>
<title>Englisch Crashkurs</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Atkinson+Hyperlegible:wght@400;700&family=Bricolage+Grotesque:opsz,wght@12..96,800&display=swap">
<style>
/* Layout: eine Spalte, Zeitstrahl der Lernrunden oben, Karteikarte im Fokus. */
:root{--bg:#eef1f5;--surface:#fff;--soft:#f5f7fa;--line:#d8dee7;--ink:#18212d;--muted:#5b6778;--accent:#2343b8;--accent-soft:#e3e8fa;--ok:#1d8f55;--ok-soft:#dcf2e6;--bad:#d0344a;--bad-soft:#fbe1e5;--warn:#b86f00;--rule:#c9d6ee;--head:#d9534f;
--fd:"Bricolage Grotesque",system-ui,sans-serif;--fb:"Atkinson Hyperlegible",system-ui,-apple-system,Roboto,sans-serif}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#0f141b;--surface:#18202b;--soft:#1e2834;--line:#2c3746;--ink:#e8edf4;--muted:#9aa7b8;--accent:#8ea6ff;--accent-soft:#232f4f;--ok:#4cc786;--ok-soft:#163225;--bad:#ff6b7d;--bad-soft:#3b1a22;--warn:#f0b03c;--rule:#2a3a55;--head:#e0716d;color-scheme:dark}}
:root[data-theme="dark"]{--bg:#0f141b;--surface:#18202b;--soft:#1e2834;--line:#2c3746;--ink:#e8edf4;--muted:#9aa7b8;--accent:#8ea6ff;--accent-soft:#232f4f;--ok:#4cc786;--ok-soft:#163225;--bad:#ff6b7d;--bad-soft:#3b1a22;--warn:#f0b03c;--rule:#2a3a55;--head:#e0716d;color-scheme:dark}
[hidden]{display:none!important}*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);font:17px/1.5 var(--fb);padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));padding-block:16px 40px}
button,input{font:inherit;color:inherit}button{cursor:pointer}:focus-visible{outline:3px solid var(--accent);outline-offset:2px}
h1,h2{font-family:var(--fd);font-weight:800;margin:0;line-height:1.15;text-wrap:balance}h1{font-size:1.7rem}h2{font-size:1.25rem}p{margin:0}
.wrap{max-width:720px;margin:0 auto;display:flex;flex-direction:column;gap:18px}
.eye{font-size:.75rem;letter-spacing:.08em;text-transform:uppercase;color:var(--muted);font-weight:700}
.muted{color:var(--muted)}.small{font-size:.875rem}
.panel{background:var(--surface);border:1px solid var(--line);border-radius:14px;padding:16px;display:flex;flex-direction:column;gap:12px;min-width:0}
.row{display:flex;gap:10px;flex-wrap:wrap;align-items:center}.sb{justify-content:space-between}
.btn{border:1px solid var(--line);background:var(--surface);border-radius:12px;padding:10px 16px;font-weight:700;min-height:46px}
.btn.p{background:var(--accent);border-color:var(--accent);color:#fff}:root[data-theme="dark"] .btn.p{color:#0f141b}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]) .btn.p{color:#0f141b}}
.btn.big{flex:1;min-height:56px;font-size:1.05rem}.btn.g{background:none;border-color:transparent;color:var(--muted);min-height:36px;padding:6px 8px}
input[type=text],input[type=time]{border:1.5px solid var(--line);background:var(--surface);border-radius:10px;padding:10px 12px;min-height:46px}
input[type=text]{width:100%}input:focus{border-color:var(--accent);outline:none}
.rounds{display:flex;flex-direction:column}
.rd{display:grid;grid-template-columns:4.2em 1fr auto;gap:12px;align-items:center;padding:10px 0;border-top:1px solid var(--line)}.rd:first-child{border-top:0}
.rd time{font-family:var(--fd);font-weight:800;font-size:1.15rem;font-variant-numeric:tabular-nums}
.rd.done time,.rd.done b{color:var(--muted)}.rd.done b{text-decoration:line-through}
.rd.due{background:var(--accent-soft);margin:0 -16px;padding:10px 16px}
.pill{font-size:.75rem;font-weight:700;padding:3px 10px;border-radius:99px;background:var(--soft);border:1px solid var(--line);white-space:nowrap}
.pill.ok{background:var(--ok-soft);color:var(--ok);border-color:transparent}.pill.due{background:var(--accent);color:#fff;border-color:transparent}
.bar{height:10px;border-radius:99px;background:var(--soft);border:1px solid var(--line);overflow:hidden}.bar i{display:block;height:100%;background:var(--accent)}
.card{position:relative;background:var(--surface);border:1px solid var(--line);border-radius:16px;padding:18px;min-height:260px;display:flex;flex-direction:column;gap:14px;
 background-image:repeating-linear-gradient(to bottom,transparent 0 31px,var(--rule) 31px 32px);background-position:0 54px;box-shadow:0 10px 28px -16px rgba(10,20,40,.4)}
.card::before{content:"";position:absolute;left:0;right:0;top:52px;height:2px;background:var(--head);opacity:.7}
.q{font-family:var(--fd);font-weight:800;font-size:clamp(1.4rem,5vw,2rem);line-height:1.2;margin-top:10px;overflow-wrap:anywhere}
.ans{background:var(--surface);border:1px dashed var(--line);border-radius:10px;padding:10px 12px;display:flex;flex-direction:column;gap:4px}
.ans .en{font-family:var(--fd);font-weight:800;font-size:1.4rem;color:var(--accent)}
.res{font-weight:700;padding:8px 12px;border-radius:10px}.res.ok{background:var(--ok-soft);color:var(--ok)}.res.bad{background:var(--bad-soft);color:var(--bad)}
mark{background:color-mix(in srgb,var(--warn) 30%,transparent);color:inherit;border-radius:3px;padding:0 2px}
.gap{display:inline-block;min-width:4em;border-bottom:2px solid var(--ink)}
.words{display:flex;flex-direction:column}
.w{display:grid;grid-template-columns:1fr auto auto;gap:10px;align-items:center;padding:8px 0;border-top:1px solid var(--line)}.w:first-child{border-top:0}
.w>div{min-width:0;overflow-wrap:anywhere}.pr{font-variant-numeric:tabular-nums;font-weight:700;color:var(--accent)}
.dots{display:flex;gap:3px}.dots i{width:9px;height:9px;border-radius:50%;background:var(--line)}.dots i.y{background:var(--ok)}.dots i.n{background:var(--bad)}
details summary{cursor:pointer;font-weight:700}details ul{margin:8px 0 0;padding-left:1.2em;display:flex;flex-direction:column;gap:6px}
</style>

</head>
<body>
<main class="wrap" id="app"></main>

<script>
// [Englisch, Deutsch, Wahrscheinlichkeit %, Wortfamilie/Gegenteil, Satz mit [Lücke], Zusatzfrage, Antwort(en)]
const W=[
["unemployment","Arbeitslosigkeit",75,"employ – employment – employer – employee – unemployed · ◄► employment","[Unemployment] is a big problem in some regions.","Gegenteil von „unemployment“?","employment"],
["illegal","illegal, verboten",70,"legal – legally – illegal · Vorsilbe il- vor l · ◄► legal","It's [illegal] to drive without a licence.","Gegenteil von „illegal“?","legal"],
["regular","regelmäßig; normal",70,"regular – regularly – irregular · ◄► irregular","‘Arrive’ is a [regular] verb.","Gegenteil von „regular“?","irregular"],
["encourage","ermutigen",65,"encourage – encouragement · ◄► discourage","My friends [encouraged] me to apply for the job.","Nomen von „encourage“?","encouragement"],
["apologize","sich entschuldigen",65,"apologize – apology · apologize TO sb. FOR doing sth.","You should [apologize] to her for saying that.","Nomen von „apologize“?","apology"],
["deny","leugnen, bestreiten",60,"deny – denial · deny + -ing · ◄► admit","He [denied] having committed the crime.","Nomen von „deny“?","denial"],
["informal","informell, locker",60,"formal – formally – informal · ◄► formal","Emails to your friends can be [informal].","Gegenteil von „informal“?","formal"],
["amateur","Amateur/in",55,"◄► professional · Betonung: Amateur","He isn't a professional – he's an [amateur].","Gegenteil von „amateur“?","professional|a professional"],
["permanent","dauerhaft, fest",55,"permanent – permanently · ◄► temporary","After school I got my first [permanent] job.","Gegenteil von „permanent“?","temporary"],
["ignore","ignorieren, nicht beachten",55,"ignore – ignorance – ignorant","They [ignored] all the safety signs.","Nomen von „ignore“?","ignorance"],
["realize","erkennen, bemerken",50,"realize – realization","When I got home, I [realized] that my bag was gone.","Nomen von „realize“?","realization|realisation"],
["explanation","Erklärung",50,"explain – explanation","Thanks for your [explanation] – now I understand.","Verb zu „explanation“?","explain|to explain"],
["separate","trennen",50,"separate (Verb) – separate (Adj., getrennt) – separately – separation","It's wrong to [separate] children from their parents.","Adverb von „separate“?","separately"],
["proud of","stolz auf",50,"proud – proudly – pride · proud OF · ◄► ashamed of","My parents are [proud of] me.","Nomen von „proud“?","pride"],
["friendliness","Freundlichkeit",45,"friend – friendly – friendliness – friendship · ◄► unfriendly","The [friendliness] of the people surprised me.","Adjektiv zu „friendliness“?","friendly"],
["direct","direkt",45,"direct – directly – direction · ◄► indirect","Is there a [direct] train to Sydney?","Gegenteil von „direct“?","indirect"],
["suffer from","leiden an",45,"suffer – suffering · suffer FROM","I often [suffer from] headaches.","Nomen von „suffer“?","suffering"],
["congratulations","Glückwunsch",45,"congratulate – congratulations · congratulations ON sth.","[Congratulations] on your good marks!","Verb zu „congratulations“?","congratulate|to congratulate"],
["bright","hell, leuchtend",40,"bright – brightly – brightness · ◄► dark","I like [bright] colours like orange and yellow.","Gegenteil von „bright“?","dark"],
["difficulty","Schwierigkeit",40,"difficult – difficulty · ◄► easy","She had [difficulty] finding the way.","Adjektiv zu „difficulty“?","difficult"]
];
// Runden: Abstände wachsen (Spacing), jede Runde fragt anders ab (Interleaving)
const R=[
 {n:"Kennenlernen + 1. Abruf",off:0,mode:"de",why:"Einmal alle 20 laut lesen, dann sofort abrufen."},
 {n:"Lückensätze",off:20,mode:"gap",why:"Nach 20 Min. – kurz vor dem Vergessen abrufen."},
 {n:"Wortfamilie & Gegenteil",off:60,mode:"fam",why:"Selbst bilden statt lesen (Generierungseffekt)."},
 {n:"Gemischt",off:150,mode:"mix",why:"Alle Aufgabentypen durcheinander."},
 {n:"Vor dem Schlafen",off:"bed",mode:"de",why:"Schlaf festigt, was du zuletzt abgerufen hast."},
 {n:"Morgen-Check",off:"morning",mode:"mix",why:"Nur abrufen, nichts Neues. Kurz und ruhig."}];
const KEY="englisch-top20-v1",$=s=>document.querySelector(s);
let S;try{S=JSON.parse(localStorage.getItem(KEY))}catch(e){}
if(!S||!S.start)S={start:Date.now(),bed:"21:30",morning:"06:30",done:{},w:{}};
const save=()=>{try{localStorage.setItem(KEY,JSON.stringify(S))}catch(e){}};save();
const esc=s=>String(s).replace(/[&<>"]/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]));
const norm=s=>String(s).toLowerCase().replace(/[’‘]/g,"'").replace(/[.,!?;:"“”]/g,"").replace(/^(to|the|a|an) /,"").replace(/\s+/g," ").trim();
const hm=t=>new Date(t).toLocaleTimeString("de-DE",{hour:"2-digit",minute:"2-digit"});
function at(day,hhmm){const[h,m]=hhmm.split(":").map(Number);const d=new Date(day);d.setHours(h,m,0,0);return +d}
function times(){
  const st=S.start,bed=at(st,S.bed)-20*6e4;let mo=at(st,S.morning);if(mo<=st)mo+=864e5;
  return R.map(r=>r.off==="bed"?Math.max(bed,st):r.off==="morning"?(new Date(st).getHours()<5?at(st,S.morning):at(st+864e5,S.morning)):Math.min(st+r.off*6e4,Math.max(bed-15*6e4,st)));
}
let RUN=null;
const TIPS=["Aufstehen, Wasser trinken, kurz bewegen.","Nicht nachschauen! Das Vergessen-Lassen ist Teil des Trainings.","Mach etwas ganz anderes: essen, frische Luft, Musik.","Keine neuen Vokabeln lernen – das stört die 20.","Licht dimmen, Handy weg, schlafen. Dein Gehirn speichert jetzt."];
function nextR(){const T=times(),k=R.findIndex((_,j)=>!S.done[j]);return k<0?null:{k,t:T[k]}}
function mmss(ms){ms=Math.max(0,ms);const h=Math.floor(ms/36e5),m=Math.floor(ms%36e5/6e4),s=Math.floor(ms%6e4/1e3);return (h?h+" Std. ":"")+String(m).padStart(h?2:1,"0")+":"+String(s).padStart(2,"0")+(h?"":" Min.")}
function banner(){const n=nextR();if(!n)return`<section class="panel"><h2>Alle Runden erledigt</h2><p>Du bist vorbereitet. Viel Erfolg in der Schulaufgabe!</p></section>`;
 const wait=n.t-Date.now();
 if(wait<=0)return`<section class="panel" style="border-color:var(--accent)"><p class="eye">Jetzt dran</p><h2>Runde ${n.k+1}: ${esc(R[n.k].n)}</h2><p class="small muted">${esc(R[n.k].why)} Dauer: ca. ${n.k===0?15:8} Min.</p><button class="btn p big" data-a="round" data-k="${n.k}">Runde ${n.k+1} starten</button></section>`;
 const tip=n.k===4?TIPS[3]:n.k===5?TIPS[4]:TIPS[n.k%3];
 return`<section class="panel"><p class="eye">Pause – bewusst warten</p><div class="row sb"><h2 id="cd" style="font-size:2.2rem;font-variant-numeric:tabular-nums">${mmss(wait)}</h2><span class="muted">bis Runde ${n.k+1} um <b>${hm(n.t)}</b> Uhr</span></div>
 <p>${tip}</p><p class="small muted">Warum warten? Wenn du ein Wort kurz vor dem Vergessen wieder abrufst, bleibt es am stärksten hängen.</p>
 <button class="btn g" data-a="round" data-k="${n.k}">Trotzdem jetzt starten</button></section>`}
function ws(i){return S.w[i]||(S.w[i]={h:[]})}
function task(i,mode){const w=W[i];const m=mode==="mix"?["de","gap","fam"][Math.floor(Math.random()*3)]:mode;
  if(m==="gap")return{i,q:w[1],sub:esc(w[4]).replace(/\[[^\]]+\]/,'<span class="gap"></span>'),a:[w[0],w[4].match(/\[([^\]]+)\]/)[1]]};
  if(m==="fam")return{i,q:w[5],sub:`(${esc(w[0])} = ${esc(w[1])})`,a:w[6].split("|")};
  return{i,q:w[1],sub:"Auf Englisch?",a:[w[0]]};}
function startRound(k){const order=W.map((_,i)=>i).sort(()=>Math.random()-.5);
  if(k===4)order.sort((a,b)=>(ws(b).h.filter(x=>!x).length)-(ws(a).h.filter(x=>!x).length));
  RUN={k,q:order.map(i=>task(i,R[k].mode)),pre:k===0,rev:false,ok:null,miss:{},right:0,n:W.length};render();}
function check(v){const t=RUN.q[0];RUN.ok=t.a.some(a=>norm(a)===norm(v));RUN.input=v;RUN.rev=true;render()}
function next(){const t=RUN.q.shift();
  if(!RUN.miss[t.i])ws(t.i).h.push(RUN.ok);
  if(RUN.ok){RUN.right++}else{RUN.miss[t.i]=(RUN.miss[t.i]||0)+1;if(RUN.miss[t.i]<4)RUN.q.splice(Math.min(3,RUN.q.length),0,task(t.i,R[RUN.k].mode))}
  RUN.rev=false;RUN.ok=null;RUN.typo=false;if(!RUN.q.length){S.done[RUN.k]=Date.now()}save();render()}
function vRun(){
  if(RUN.pre)return`<div class="row sb"><h2>Runde 1: Laut lesen</h2><button class="btn g" data-a="stop">Abbrechen</button></div>
  <p class="muted">Lies jede Zeile einmal <b>laut</b>, mit Satz. Nicht auswendig lernen – gleich kommt der Abruf.</p>
  <section class="panel">${W.map(w=>`<div><b>${esc(w[0])}</b> – ${esc(w[1])}<br><span class="small">${esc(w[4]).replace(/\[([^\]]+)\]/,"<mark>$1</mark>")}</span><br><span class="small muted">${esc(w[3])}</span></div>`).join("<hr style='border:0;border-top:1px solid var(--line);margin:0'>")}</section>
  <button class="btn p big" data-a="go">Gelesen – jetzt abfragen</button>`;
  if(!RUN.q.length){const wrong=Object.keys(RUN.miss).map(i=>W[i][0]);const nx=times().findIndex((t,k)=>!S.done[k]);
   return`<section class="panel"><h2>Runde geschafft</h2><p>${RUN.n-wrong.length} von ${RUN.n} beim ersten Versuch richtig.</p>
   ${wrong.length?`<p class="small">Wackelig: <b>${wrong.map(esc).join(", ")}</b> – die kommen in der Schlaf-Runde zuerst.</p>`:""}
   <p class="muted small">${nx<0?"Alle Runden erledigt. Du bist vorbereitet – viel Erfolg!":RUN.k===4?"Jetzt Handy weg und schlafen. Morgen früh nur noch der kurze Check.":"Nächste Runde um "+hm(times()[nx])+" Uhr. Die Pause ist Absicht: Abrufen kurz vor dem Vergessen festigt am stärksten."}</p>
   </section>${banner()}<button class="btn" data-a="stop">Zur Übersicht</button>`}
  const t=RUN.q[0],w=W[t.i],left=RUN.q.length;
  return`<div class="row sb"><h2>${esc(R[RUN.k].n)}</h2><button class="btn g" data-a="stop">Abbrechen</button></div>
  <article class="card"><div class="row sb small muted"><span>Chance in der SA: <b class="pr">${w[2]} %</b></span><span>noch ${left}</span></div>
   <p class="q">${esc(t.q)}</p><p>${t.sub}</p>
   ${RUN.rev?`<p class="res ${RUN.ok?"ok":"bad"}">${RUN.ok?(RUN.typo?"Als richtig gezählt – schau dir die Schreibweise unten genau an.":"Richtig!"):"Noch nicht – lies die Lösung laut, sie kommt gleich nochmal."}</p>
    ${!RUN.ok&&RUN.input&&RUN.input.trim()?`<p class="small">Du hast: <b>${esc(RUN.input)}</b></p><button class="btn" data-a="typo" style="border-color:var(--ok);color:var(--ok)">„Nur falsch geschrieben“ – als richtig zählen</button>`:""}
    <div class="ans"><span class="en">${esc(t.a[0])}</span><span>${esc(w[0])} = ${esc(w[1])}</span><span class="small">${esc(w[4]).replace(/\[([^\]]+)\]/,"<mark>$1</mark>")}</span><span class="small muted">${esc(w[3])}</span></div>
    <button class="btn p big" data-a="next" id="nx">Weiter</button>`
   :`<form id="f" class="row" style="flex-wrap:nowrap"><input type="text" id="in" autocomplete="off" autocapitalize="off" spellcheck="false" placeholder="Antwort eintippen …" aria-label="Antwort"><button class="btn p">Prüfen</button></form>
    <button class="btn g" data-a="idk">Weiß ich nicht</button>`}</article>
  <p class="small muted">Erst im Kopf sagen, dann tippen. Raten ist erlaubt – auch ein falscher Versuch hilft dem Gedächtnis.</p>`;
}
function vHome(){
  const T=times(),now=Date.now(),nd=Object.keys(S.done).length;
  const rows=R.map((r,k)=>{const done=S.done[k],due=!done&&T[k]<=now,first=R.findIndex((_,j)=>!S.done[j])===k;
   return`<div class="rd ${done?"done":due&&first?"due":""}"><time>${hm(T[k])}</time><div><b>${esc(r.n)}</b><br><span class="small muted">${esc(r.why)}</span></div>
   ${done?`<span class="pill ok">erledigt</span>`:due?`<button class="btn ${first?"p":""}" data-a="round" data-k="${k}">Start</button>`:`<span class="pill" title="Früher starten geht, Warten wirkt aber besser">in ${Math.max(1,Math.round((T[k]-now)/6e4))} Min.</span>`}</div>`}).join("");
  const mast=W.map((w,i)=>({w,i,h:ws(i).h})).sort((a,b)=>b.w[2]-a.w[2]);
  const sicher=mast.filter(x=>x.h.length>=2&&x.h.slice(-2).every(Boolean)).length;
  return`<header class="row sb" style="align-items:flex-end"><div><p class="eye">Schulaufgabe Do, 12. Nov. · früh</p><h1>Deine 20 Wörter</h1></div><span class="muted small">Start: ${new Date(S.start).toLocaleDateString("de-DE",{day:"numeric",month:"short"})}, ${hm(S.start)} Uhr</span></header>
  ${banner()}
  <section class="panel"><div class="row sb"><b>${sicher} von 20 sitzen</b><span class="small muted">${nd} von ${R.length} Runden</span></div><div class="bar"><i style="width:${sicher*5}%"></i></div>
   <p class="small muted">„Sitzt“ heißt: die letzten zwei Abrufe richtig.</p></section>
  <section class="panel"><h2>Dein Zeitplan</h2><div class="rounds">${rows}</div>
   <div class="row small"><label>Schlafen um <input type="time" id="bed" value="${S.bed}"></label><label>Aufstehen um <input type="time" id="mo" value="${S.morning}"></label></div></section>
  <section class="panel"><h2>Die 20 nach Wahrscheinlichkeit</h2><div class="words">${mast.map(x=>`<div class="w"><div><b>${esc(x.w[0])}</b> <span class="muted">– ${esc(x.w[1])}</span><br><span class="small muted">${esc(x.w[3])}</span></div>
   <span class="dots" aria-label="Abrufe">${x.h.slice(-6).map(v=>`<i class="${v?"y":"n"}"></i>`).join("")||"<i></i>"}</span><span class="pr">${x.w[2]} %</span></div>`).join("")}</div>
   <p class="small muted">Geschätzt aus Wortfamilie, Gegenteil, Präposition und Unit-Thema – keine echten alten Schulaufgaben.</p></section>
  <section class="panel"><details><summary>Warum diese App so funktioniert</summary><ul class="small">
   <li><b>Abrufen statt lesen</b> (Roediger &amp; Karpicke 2006): Du tippst jedes Wort selbst – das stärkt die Erinnerung am meisten.</li>
   <li><b>Wachsende Abstände</b> (Cepeda u. a. 2006): Runden nach 20 Min., 1 Std., 2,5 Std., vor dem Schlaf, am Morgen.</li>
   <li><b>Wechselnde Aufgabentypen</b>: Deutsch→Englisch, Lückensatz, Wortfamilie/Gegenteil – so wie in der Schulaufgabe.</li>
   <li><b>Selbst bilden</b> (Generierungseffekt): Nomen und Gegenteile erzeugst du selbst.</li>
   <li><b>Laut lesen</b> (Production Effect, MacLeod 2010).</li>
   <li><b>Schlaf</b> (Diekelmann &amp; Born 2010): Die letzte Runde direkt vor dem Schlafen, dann 7–8 Stunden schlafen.</li></ul></details>

}
