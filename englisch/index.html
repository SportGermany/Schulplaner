<title>Englisch Crashkurs</title>

<style>
/* Layout: Karteikasten-App. Handy = eine Spalte + Leiste unten; Tablet = Leiste links, Inhalt mittig. */
:root{
  --bg:#eef1f5; --surface:#ffffff; --surface-2:#f6f8fb; --line:#d8dee7; --ink:#18212d; --muted:#5b6778;
  --accent:#2343b8; --accent-ink:#ffffff; --accent-soft:#e3e8fa;
  --card-rule:#c9d6ee; --card-head:#d9534f;
  --s-u:#7b8698; --s-n:#2f6fdf; --s-f:#c77d00; --s-p:#d0344a; --s-k:#1d8f55;
  --s-n-soft:#e2ecfc; --s-f-soft:#fbefd6; --s-p-soft:#fbe1e5; --s-k-soft:#dcf2e6; --s-u-soft:#e9ecf1;
  --ok:#1d8f55; --bad:#d0344a; --warn:#c77d00;
  --f-display:"Bricolage Grotesque", "Segoe UI", system-ui, sans-serif;
  --f-body:"Atkinson Hyperlegible", "Segoe UI", system-ui, -apple-system, Roboto, sans-serif;
  --r:14px; --nav-h:64px;
}
@media (prefers-color-scheme: dark){ :root:not([data-theme="light"]){
  --bg:#0f141b; --surface:#18202b; --surface-2:#1e2834; --line:#2c3746; --ink:#e8edf4; --muted:#9aa7b8;
  --accent:#8ea6ff; --accent-ink:#0f141b; --accent-soft:#232f4f;
  --card-rule:#2a3a55; --card-head:#e0716d;
  --s-u:#8e99aa; --s-n:#6c9cff; --s-f:#f0b03c; --s-p:#ff6b7d; --s-k:#4cc786;
  --s-n-soft:#1c2a45; --s-f-soft:#342812; --s-p-soft:#3b1a22; --s-k-soft:#163225; --s-u-soft:#232b36;
  --ok:#4cc786; --bad:#ff6b7d; --warn:#f0b03c; color-scheme:dark;
}}
:root[data-theme="dark"]{
  --bg:#0f141b; --surface:#18202b; --surface-2:#1e2834; --line:#2c3746; --ink:#e8edf4; --muted:#9aa7b8;
  --accent:#8ea6ff; --accent-ink:#0f141b; --accent-soft:#232f4f;
  --card-rule:#2a3a55; --card-head:#e0716d;
  --s-u:#8e99aa; --s-n:#6c9cff; --s-f:#f0b03c; --s-p:#ff6b7d; --s-k:#4cc786;
  --s-n-soft:#1c2a45; --s-f-soft:#342812; --s-p-soft:#3b1a22; --s-k-soft:#163225; --s-u-soft:#232b36;
  --ok:#4cc786; --bad:#ff6b7d; --warn:#f0b03c; color-scheme:dark;
}
[hidden]{display:none!important}
*{box-sizing:border-box}
html{-webkit-text-size-adjust:100%}
body{margin:0;background:var(--bg);color:var(--ink);font:16px/1.5 var(--f-body);
  padding-left:max(16px, env(safe-area-inset-left, 0px));padding-right:max(16px, env(safe-area-inset-right, 0px));
  padding-block:0 calc(var(--nav-h) + 24px + env(safe-area-inset-bottom, 0px));}
button,input,textarea{font:inherit;color:inherit}
button{cursor:pointer}
:focus-visible{outline:3px solid var(--accent);outline-offset:2px}
h1,h2,h3{font-family:var(--f-display);text-wrap:balance;margin:0;line-height:1.15}
h1{font-size:1.6rem;font-weight:800;letter-spacing:-.01em}
h2{font-size:1.3rem;font-weight:800}
h3{font-size:1.05rem;font-weight:600}
p{margin:0}
.wrap{max-width:880px;margin:0 auto;display:flex;flex-direction:column;gap:20px;padding-top:16px}
.top{display:flex;align-items:flex-end;justify-content:space-between;gap:12px;flex-wrap:wrap}
.eyebrow{font-size:.75rem;letter-spacing:.08em;text-transform:uppercase;color:var(--muted);font-weight:700}
.count{display:flex;align-items:baseline;gap:6px;font-variant-numeric:tabular-nums}
.count b{font-family:var(--f-display);font-size:1.8rem;font-weight:800;color:var(--accent)}
.muted{color:var(--muted)}
.small{font-size:.875rem}

/* Navigation */
nav.bar{position:fixed;left:0;right:0;bottom:0;z-index:20;background:var(--surface);border-top:1px solid var(--line);
  display:grid;grid-template-columns:repeat(6,1fr);
  padding:6px max(8px, env(safe-area-inset-right, 0px)) calc(6px + env(safe-area-inset-bottom, 0px)) max(8px, env(safe-area-inset-left, 0px))}
nav.bar button{border:0;background:none;display:flex;flex-direction:column;align-items:center;gap:2px;padding:6px 2px;border-radius:10px;color:var(--muted);font-size:.7rem;font-weight:700;min-width:0}
nav.bar button svg{width:24px;height:24px}
nav.bar button[aria-current="page"]{color:var(--accent);background:var(--accent-soft)}
@media (min-width:900px){
  body{padding-bottom:32px;padding-left:max(120px, calc(env(safe-area-inset-left, 0px) + 104px))}
  nav.bar{top:0;bottom:0;right:auto;width:96px;grid-template-columns:1fr;grid-auto-rows:min-content;align-content:center;gap:6px;border-top:0;border-right:1px solid var(--line);
    padding:calc(16px + env(safe-area-inset-top, 0px)) 8px 16px max(8px, env(safe-area-inset-left, 0px))}
  nav.bar button{font-size:.75rem;padding:10px 4px}
  nav.bar button svg{width:26px;height:26px}
}

/* Bausteine */
.panel{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:18px;display:flex;flex-direction:column;gap:12px;min-width:0}
.seg{display:flex;gap:4px;background:var(--surface-2);border:1px solid var(--line);border-radius:12px;padding:4px;flex-wrap:wrap}
.seg button{flex:1 1 auto;border:0;background:none;border-radius:9px;padding:8px 10px;font-weight:700;font-size:.9rem;color:var(--muted);white-space:nowrap}
.seg button[aria-pressed="true"]{background:var(--surface);color:var(--ink);box-shadow:0 1px 3px rgba(0,0,0,.12)}
.btn{border:1px solid var(--line);background:var(--surface);border-radius:12px;padding:10px 16px;font-weight:700;display:inline-flex;align-items:center;justify-content:center;gap:8px;min-height:44px}
.btn.primary{background:var(--accent);color:var(--accent-ink);border-color:var(--accent)}
.btn.ok{background:var(--ok);border-color:var(--ok);color:#fff}
.btn.bad{background:var(--bad);border-color:var(--bad);color:#fff}
.btn.ghost{background:none}
.btn.big{min-height:56px;font-size:1.05rem;flex:1}
.row{display:flex;gap:10px;flex-wrap:wrap;align-items:center}
.chip{display:inline-flex;align-items:center;gap:6px;font-size:.75rem;font-weight:700;letter-spacing:.03em;padding:3px 9px;border-radius:99px;background:var(--surface-2);border:1px solid var(--line);color:var(--muted);white-space:nowrap}
.chip.m{background:var(--accent-soft);border-color:transparent;color:var(--accent)}
input[type=text],textarea{width:100%;border:1.5px solid var(--line);background:var(--surface);border-radius:10px;padding:10px 12px;min-height:44px}
input[type=text]:focus,textarea:focus{border-color:var(--accent);outline:none}
textarea{min-height:90px;resize:vertical}
mark{background:color-mix(in srgb, var(--s-f) 28%, transparent);color:inherit;border-radius:3px;padding:0 2px}
.gap{display:inline-block;min-width:4.5em;border-bottom:2px solid var(--ink);margin:0 2px}

/* Plan */
.progress{height:10px;border-radius:99px;background:var(--surface-2);border:1px solid var(--line);overflow:hidden}
.progress i{display:block;height:100%;background:var(--accent);border-radius:99px;transition:width .3s}
.day{display:flex;flex-direction:column;gap:10px}
.dayhead{display:flex;justify-content:space-between;align-items:baseline;gap:10px;flex-wrap:wrap}
.step{display:grid;grid-template-columns:auto 1fr;gap:12px;align-items:start;background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:14px}
.step.done{background:var(--surface-2)}
.step.done .st-title{text-decoration:line-through;color:var(--muted)}
.tick{width:30px;height:30px;border-radius:9px;border:2px solid var(--line);background:var(--surface);display:grid;place-items:center;padding:0}
.tick svg{width:18px;height:18px;opacity:0}
.step.done .tick{background:var(--ok);border-color:var(--ok);color:#fff}
.step.done .tick svg{opacity:1}
.st-body{display:flex;flex-direction:column;gap:6px;min-width:0}
.st-meta{display:flex;gap:6px;flex-wrap:wrap;align-items:center}
.st-title{font-weight:700;font-size:1.02rem}
.note{border-left:4px solid var(--s-f);background:var(--s-f-soft);padding:12px 14px;border-radius:0 10px 10px 0}

/* Stapel */
.stacks{display:grid;grid-template-columns:repeat(5,1fr);gap:8px}
@media (max-width:560px){.stacks{grid-template-columns:repeat(3,1fr)}}
.stack{border:1px solid var(--line);border-radius:12px;padding:10px 8px;display:flex;flex-direction:column;align-items:flex-start;gap:2px;background:var(--surface);text-align:left;min-width:0;position:relative;overflow:hidden}
.stack::before{content:"";position:absolute;left:0;top:0;bottom:0;width:5px;background:var(--c)}
.stack b{font-family:var(--f-display);font-size:1.6rem;font-weight:800;color:var(--c);font-variant-numeric:tabular-nums;padding-left:6px}
.stack span{font-size:.75rem;font-weight:700;color:var(--muted);padding-left:6px;line-height:1.2}
.stack[disabled]{opacity:.55;cursor:default}

/* Karteikarte */
.kcard{position:relative;background:var(--surface);border-radius:16px;border:1px solid var(--line);box-shadow:0 10px 28px -14px rgba(10,20,40,.35);
  background-image:repeating-linear-gradient(to bottom, transparent 0 31px, var(--card-rule) 31px 32px);background-position:0 58px;
  padding:20px 20px 18px;min-height:280px;display:flex;flex-direction:column;gap:14px}
.kcard::before{content:"";position:absolute;left:0;right:0;top:56px;height:2px;background:var(--card-head);opacity:.7}
.kc-top{display:flex;justify-content:space-between;gap:8px;align-items:center;min-height:24px}
.kc-q{font-family:var(--f-display);font-weight:800;font-size:clamp(1.5rem, 5vw, 2.2rem);line-height:1.15;margin-top:12px;overflow-wrap:anywhere}
.kc-ex{font-size:1.08rem;line-height:32px;background:var(--surface);padding:0 4px;border-radius:6px;align-self:flex-start}
.kc-a{display:flex;flex-direction:column;gap:6px;background:var(--surface);border-radius:10px;padding:10px 12px;border:1px dashed var(--line)}
.kc-a .en{font-family:var(--f-display);font-weight:800;font-size:1.5rem;color:var(--accent);overflow-wrap:anywhere}
.kc-info{font-size:.9rem;color:var(--muted)}
.stackdot{display:inline-flex;align-items:center;gap:6px;font-size:.75rem;font-weight:700;color:var(--muted)}
.stackdot i{width:10px;height:10px;border-radius:50%;background:var(--c)}
.res{font-weight:700;padding:8px 12px;border-radius:10px}
.res.ok{background:var(--s-k-soft);color:var(--ok)} .res.bad{background:var(--s-p-soft);color:var(--bad)} .res.warn{background:var(--s-f-soft);color:var(--warn)}
.calm{background:#141a2a;color:#e7e9f5;border-radius:18px;padding:22px;display:flex;flex-direction:column;gap:14px}
.calm .kcard{background-color:#1c2336;border-color:#2c3550;color:#e7e9f5;background-image:repeating-linear-gradient(to bottom, transparent 0 31px, #263049 31px 32px)}
.calm .kc-ex,.calm .kc-a{background:#1c2336}
.calm .kc-a .en{color:#a9b8ff}
.calm .muted,.calm .kc-info{color:#a6adc8}

/* Grammatik & Übungen */
.rule{display:flex;flex-direction:column;gap:8px}
.rule ul{margin:0;padding-left:1.2em;display:flex;flex-direction:column;gap:4px}
.pattern{display:grid;grid-template-columns:auto 1fr;gap:12px;align-items:start;border:1px solid var(--line);border-radius:12px;padding:12px;background:var(--surface-2)}
.pattern .n{font-family:var(--f-display);font-weight:800;color:var(--accent);font-size:1.3rem;line-height:1}
.pattern .de{font-weight:700}
.pattern .en{font-size:1.05rem}
.ex{display:flex;flex-direction:column;gap:8px;padding:12px 0;border-top:1px solid var(--line)}
.ex:first-child{border-top:0}
.ex .q{font-size:1.02rem}
.ex .fb{font-size:.92rem}
.ex.ok input{border-color:var(--ok)} .ex.bad input{border-color:var(--bad)}
.tablewrap{overflow-x:auto;border:1px solid var(--line);border-radius:12px}
table{border-collapse:collapse;width:100%;font-size:.92rem;min-width:560px}
th,td{text-align:left;padding:8px 10px;border-bottom:1px solid var(--line);vertical-align:top}
th{background:var(--surface-2);font-size:.75rem;letter-spacing:.05em;text-transform:uppercase;color:var(--muted)}
tr:last-child td{border-bottom:0}
.pairs{display:grid;grid-template-columns:repeat(auto-fill,minmax(210px,1fr));gap:8px}
.pair{border:1px solid var(--line);border-radius:10px;padding:8px 10px;background:var(--surface);font-size:.95rem}
.pair b{font-weight:700}
.trap{display:grid;grid-template-columns:auto 1fr;gap:12px;align-items:start;padding:12px 0;border-top:1px solid var(--line)}
.trap:first-child{border-top:0}
.trap.done .tt{color:var(--muted)}
.log{border:1px solid var(--line);border-radius:12px;padding:12px;display:flex;flex-direction:column;gap:4px;background:var(--surface)}
.log.solved{opacity:.6}
.log .wrong{color:var(--bad);text-decoration:line-through}
.log .right{color:var(--ok);font-weight:700}
.grade{font-family:var(--f-display);font-weight:800;font-size:3rem;color:var(--accent);line-height:1}
.list{display:flex;flex-direction:column}
.li{display:grid;grid-template-columns:1fr 1fr auto;gap:10px;padding:8px 0;border-top:1px solid var(--line);align-items:center;font-size:.95rem}
.li:first-child{border-top:0}
.li > *{min-width:0;overflow-wrap:anywhere}
.toast{position:fixed;left:50%;transform:translateX(-50%);bottom:calc(var(--nav-h) + 20px + env(safe-area-inset-bottom, 0px));background:var(--ink);color:var(--bg);padding:10px 16px;border-radius:12px;font-weight:700;z-index:30;max-width:calc(100% - 32px)}
@media (min-width:900px){.toast{bottom:24px}}
@media (prefers-reduced-motion: reduce){*{transition:none!important;animation:none!important}}
</style>

</head>

const $=s=>document.querySelector(s);
const esc=s=>String(s).replace(/[&<>"]/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]));
const shuffle=a=>{a=a.slice();for(let i=a.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[a[i],a[j]]=[a[j],a[i]]}return a};
function norm(s){
  return String(s).toLowerCase().replace(/[’‘`´]/g,"'").replace(/[“”„"]/g,"")
   .replace(/\bcan't\b/g,"cannot").replace(/\bwon't\b/g,"will not").replace(/n't\b/g," not")
   .replace(/'m\b/g," am").replace(/'re\b/g," are").replace(/'ve\b/g," have").replace(/'ll\b/g," will").replace(/\b(it|he|she|that|there|what)'s\b/g,"$1 is")
   .replace(/[.,!?;:()…–-]/g," ").replace(/\s+/g," ").trim();
}
function vnorm(s){return norm(s).replace(/\b(sth|sb|something|somebody|someone)\b/g," ").replace(/^(to|the|a|an) /,"").replace(/\s+/g," ").trim()}
function lev(a,b){const m=a.length,n=b.length;if(Math.abs(m-n)>2)return 9;const d=Array.from({length:m+1},(_,i)=>[i]);for(let j=1;j<=n;j++)d[0][j]=j;for(let i=1;i<=m;i++)for(let j=1;j<=n;j++)d[i][j]=Math.min(d[i-1][j]+1,d[i][j-1]+1,d[i-1][j-1]+(a[i-1]===b[j-1]?0:1));return d[m][n]}
function target(c){const m=c.ex.match(/\[([^\]]+)\]/);return m?m[1]:c.en}
function vocabVariants(c){const v=new Set([vnorm(c.en),vnorm(target(c))]);c.en.split(/[,/]/).forEach(x=>v.add(vnorm(x)));if(c.en==="anti-")v.add("anti");return [...v].filter(Boolean)}
// Ergebnis: "ok" | "typo" | "bad"
function checkVocab(c,input){const i=vnorm(input);if(!i)return "bad";const vs=vocabVariants(c);if(vs.includes(i))return "ok";if(vs.some(v=>v.length>=5&&lev(v,i)<=1))return "typo";return "bad"}
function checkEx(ans,input){const i=norm(input);if(!i)return false;return ans.split("|").some(a=>norm(a)===i)}
function gapHTML(ex){return esc(ex).replace(/\[([^\]]+)\]/,'<span class="gap" aria-label="Lücke"></span>')}
function markHTML(ex){return esc(ex).replace(/\[([^\]]+)\]/,"<mark>$1</mark>")}

function addLog(entry){

  else S.log.unshift(Object.assign({t:Date.now(),n:1,solved:false},entry));
  save();
}

/* ================== KARTEN ================== */
let SES=null;
function startSession(mode,deck){
  if(deck)S.deck=deck;
  const pool=mode==="reset"?CARDS.filter(c=>cs(c.id).s==="p"):deckCards(S.deck).filter(c=>cs(c.id).s===mode);
  SES={mode,queue:shuffle(pool.map(c=>c.id)),rev:false,res:null,reps:{},right:0,wrong:0,total:pool.length};
  S.view="cards";save();render();window.scrollTo(0,0);
}
function vCards(){
  const cnt=counts(S.deck);
  const deckSeg=`<div class="seg" role="group" aria-label="Wortliste">${[["all","Alle"],["u1","Unit 1"],["gws","Grundwortschatz"]].map(([k,l])=>`<button data-act="deck" data-d="${k}" aria-pressed="${S.deck===k}">${l}</button>`).join("")}</div>`;
  const stacks=`<div class="stacks">${Object.keys(STK).map(k=>`<button class="stack" style="--c:var(${STK[k][1]})" data-act="start" data-m="${k}" ${cnt[k]&&k!=="k"?"":"disabled"} aria-label="${STK[k][0]}: ${cnt[k]} Karten${k!=="k"?", starten":""}"><b>${cnt[k]}</b><span>${k==="u"?"Unsortiert → Triage":STK[k][0]}</span></button>`).join("")}</div>`;
  let body="";

  else if(SES){body=`<section class="${SES.mode==="reset"?"calm":"panel"}">${SES.mode==="reset"?`<h2>Fertig für heute.</h2><p>Handy weg, Licht aus. Dein Gehirn sortiert die Wörter jetzt im Schlaf weiter.</p>`:`<h2>Runde geschafft</h2><p>${SES.total} Karten · ${SES.right} gewusst · ${SES.wrong} nicht gewusst.</p><p class="muted small">Tipp: Am Ende zählt nur noch der Problemstapel. Den wiederholst du so lange, bis er leer ist.</p>`}
   <div class="row"><button class="btn primary" data-act="endses">Zur Übersicht</button>${counts("all").p?`<button class="btn" data-act="start" data-m="p">Problemstapel üben</button>`:""}</div></section>`}
  else body=`<section class="panel"><h3>So funktionieren die 3 Stapel</h3>
   <p><b>1. Triage (80/20):</b> Alle unsortierten Wörter einmal kurz: sicher → gekonnt, unsicher → <b style="color:var(--s-n)">Neu</b>.</p>
   <p><b>2. Neu:</b> gewusst → <b style="color:var(--s-f)">Fast gekonnt</b>, nicht gewusst → <b style="color:var(--s-p)">Problem</b>.</p>
   <p><b>3. Fast gekonnt:</b> gewusst → <b style="color:var(--s-k)">Gekonnt</b>, nicht gewusst → Problem.</p>
   <p><b>Problem:</b> zweimal hintereinander gewusst → zurück zu Fast gekonnt. Am Ende wiederholst du nur noch diesen Stapel.</p>
   <div class="row"><button class="btn primary" data-act="start" data-m="${cnt.u?"u":cnt.n?"n":cnt.f?"f":"p"}" ${cnt.u+cnt.n+cnt.f+cnt.p?"":"disabled"}>Weiterlernen</button><button class="btn" data-act="start" data-m="reset" ${counts("all").p?"":"disabled"}>Abend-Reset</button></div></section>
   ${listHTML()}`;
  if(SES&&SES.queue.length) return body;
  return `<header class="top"><div><p class="eyebrow">Karteikasten · Mini-Context</p><h1>Vokabelkarten</h1></div></header>
   ${deckSeg}${stacks}
   <div class="row"><div class="seg" role="group" aria-label="Richtung"><button data-act="dir" data-d="de" aria-pressed="${S.dir==="de"}">Deutsch → Englisch</button><button data-act="dir" data-d="en" aria-pressed="${S.dir==="en"}">Englisch → Deutsch</button></div>
   <div class="seg" role="group" aria-label="Antwort"><button data-act="typing" data-t="0" aria-pressed="${!S.typing}">Aufdecken</button><button data-act="typing" data-t="1" aria-pressed="${S.typing}">Eintippen</button></div></div>

function cardHTML(){
  const c=byId[SES.queue[0]],st=cs(c.id),mode=SES.mode,tri=mode==="u",reset=mode==="reset";
  const typing=S.typing&&S.dir==="de"&&!tri;

  const front=S.dir==="de"
    ?`<p class="kc-q">${esc(c.de)}</p><p class="kc-ex">${gapHTML(c.ex)}</p>`
    :`<p class="kc-q">${esc(c.en)}</p><p class="kc-ex">${markHTML(c.ex)}</p>`;
  const back=`<div class="kc-a"><span class="en">${esc(S.dir==="de"?c.en:c.de)}</span>${S.dir==="de"?`<span>${markHTML(c.ex)}</span>`:""}${c.info?`<span class="kc-info">${esc(c.info)}</span>`:""}</div>`;
  let ctrl;
  if(tri) ctrl=`${SES.rev?back:""}<div class="row"><button class="btn big bad" data-act="rate" data-ok="0">Unsicher</button><button class="btn big ok" data-act="rate" data-ok="1">Sicher</button></div>
    ${SES.rev?"":`<button class="btn ghost small" data-act="reveal">Lösung zeigen</button>`}`;
  else if(typing&&!SES.rev) ctrl=`<form class="row" data-form="type" style="flex-wrap:nowrap"><input type="text" id="ans" autocomplete="off" autocapitalize="off" spellcheck="false" placeholder="Englisch eintippen …" aria-label="Antwort"><button class="btn primary">Prüfen</button></form>`;
  else if(!SES.rev) ctrl=`<button class="btn big primary" data-act="reveal">Aufdecken</button>`;
  else if(typing) ctrl=`${back}<p class="res ${SES.res==="ok"?"ok":SES.res==="typo"?"warn":"bad"}">${SES.res==="ok"?"Richtig!":SES.res==="typo"?"Fast – achte auf die Schreibweise. Zählt als gewusst.":"Leider falsch. Kommt in den Problemstapel."}</p><button class="btn big primary" data-act="rate" data-ok="${SES.res==="bad"?0:1}">Weiter</button>`;
  else ctrl=`${back}<div class="row"><button class="btn big bad" data-act="rate" data-ok="0">Nicht gewusst</button><button class="btn big ok" data-act="rate" data-ok="1">Gewusst</button></div>`;
  const inner=`<article class="kcard"><div class="kc-top"><span class="stackdot" style="--c:var(${STK[st.s][1]})"><i></i>${STK[st.s][0]}${st.s==="p"&&st.st?" · 1× richtig":""}</span><span class="muted small">${c.deck==="u1"?"Unit 1":"Grundwortschatz"} · noch ${left}</span></div>${front}${ctrl}</article>`;
  const title=tri?"Triage: sicher oder unsicher?":reset?"Abend-Reset":`Stapel: ${STK[mode][0]}`;
  if(reset) return `<section class="calm"><div class="row" style="justify-content:space-between"><h2>${title}</h2><button class="btn ghost" style="color:inherit;border-color:#3a4566" data-act="endses">Beenden</button></div><p class="muted small">Nur der Problemstapel, einmal durch. Langsam lesen, Satz leise mitsprechen.</p>${inner}</section>`;
  return `<section class="day"><div class="row" style="justify-content:space-between;flex-wrap:nowrap"><h2>${title}</h2><button class="btn ghost" data-act="endses">Beenden</button></div>
   <div class="row small"><button class="btn ghost small" data-act="dir" data-d="${S.dir==="de"?"en":"de"}">${S.dir==="de"?"Deutsch → Englisch":"Englisch → Deutsch"} ⇄</button>${tri?"":`<button class="btn ghost small" data-act="typing" data-t="${S.typing?0:1}">${S.typing?"Eintippen":"Aufdecken"} ⇄</button>`}</div>${inner}</section>`;
}
function rate(ok){
  const id=SES.queue.shift(),c=byId[id],st=cs(id),m=SES.mode;
  SES.rev=false;SES.res=null;SES.reps[id]=(SES.reps[id]||0)+1;
  const again=()=>{if(SES.reps[id]<4)SES.queue.splice(Math.min(3,SES.queue.length),0,id)};
  if(ok)SES.right++;else SES.wrong++;
  if(m==="u"){st.s=ok?"k":"n"}
  else{
    if(!ok){st.w++;st.st=0;addLog({key:"v:"+id,typ:"Vokabel",frage:c.de,falsch:SES.lastInput||"",richtig:c.en,notiz:c.info||""})}
    if(m==="n")st.s=ok?"f":"p";
    else if(m==="f")st.s=ok?"k":"p";
    else if(m==="p"||m==="reset"){
      if(st.s!=="p"){st.s=ok?"f":"p"}
      else if(ok){st.st++;if(st.st>=2){st.s="f";st.st=0}else if(m==="p")again()}
      else if(m==="p")again();
    }
  }
  SES.lastInput="";save();render();
}

let QUIZ=null;
function makeQuiz(n){
  const items=[];
  shuffle(SYN).slice(0,Math.ceil(n/2)).forEach(g=>{const [p,...rest]=shuffle(g);items.push({q:`Synonym zu „${p}“`,a:rest.join("|"),e:`${g.join(" = ")}`})});
  shuffle(OPP).slice(0,Math.floor(n/2)).forEach(g=>{let p=g[0],a=g.slice(1);if(g.length===2&&Math.random()<.5){p=g[1];a=[g[0]]}items.push({q:`Gegenteil von „${p}“`,a:a.join("|"),e:`${g[0]} ◄► ${g.slice(1).join(" / ")}`})});
  return shuffle(items);
}

/* ================== PROBE-SCHULAUFGABE ================== */
function buildProbe(){
  const pri=shuffle(CARDS.filter(c=>["p","f","n"].includes(cs(c.id).s))),rest=shuffle(CARDS.filter(c=>!pri.includes(c)));
  const pick=(n,excl)=>pri.concat(rest).filter(c=>!excl.includes(c.id)).slice(0,n);
  const a=pick(8,[]),b=pick(5,a.map(c=>c.id));
  const sec=[
   {t:"A · Vokabeln: Übersetze ins Englische",items:a.map(c=>({q:c.de,a:c.en,card:c.id,kind:"v"}))},
   {t:"B · Mini-Context: Ergänze das fehlende Wort",items:b.map(c=>({q:c.ex.replace(/\[[^\]]+\]/,"___")+` (${c.de})`,a:target(c),card:c.id,kind:"v"}))},
   {t:"C · Word families: Bilde die richtige Form",items:shuffle(EX_WF).slice(0,6).map(x=>Object.assign({kind:"e"},x))},
   {t:"D · used to",items:shuffle(EX_USED).slice(0,6).map(x=>Object.assign({kind:"e"},x))},
   {t:"E · Synonyme & Gegenteile",items:makeQuiz(5).map(x=>Object.assign({kind:"e"},x))},
   {t:"F · -ing & Präpositionen",items:shuffle(EX_ING).slice(0,4).map(x=>Object.assign({kind:"e"},x))}];
  S.probe={sec,ans:{},done:false,start:Date.now()};save();
}
function grade(p){return p>=90?1:p>=77?2:p>=63?3:p>=50?4:p>=30?5:6}

  const P=S.probe;
  if(!P)return `<header class="top"><div><p class="eyebrow">Simulation</p><h1>Probe-Schulaufgabe</h1></div></header>
  <section class="panel"><p>34 Aufgaben wie in einer Schulaufgabe: Vokabeln, Mini-Context, Word families, used to, Synonyme/Gegenteile und -ing. Deine Problemwörter kommen bevorzugt dran.</p>
  <p class="muted small">Plane 25 Minuten ein. Kein Nachschauen. Am Ende siehst du Punkte, eine grobe Note und alle Lösungen.</p><div><button class="btn primary big" data-act="probe-new" style="flex:0 0 auto">Probe starten</button></div></section>`;
  let n=0,pts=0,max=0;
  const html=P.sec.map((s,si)=>`<section class="panel"><h3>${s.t}</h3>${s.items.map((x,ii)=>{n++;const k=si+"-"+ii,v=P.ans[k]||"";let fb="";
    if(P.done){max++;let r;if(x.kind==="v"){r=checkVocab(byId[x.card],v)}else r=checkEx(x.a,v)?"ok":"bad";const p=r==="ok"?1:r==="typo"?.5:0;pts+=p;
     fb=`<p class="fb" style="color:var(${r==="bad"?"--bad":r==="typo"?"--warn":"--ok"})"><b>${r==="ok"?"Richtig":r==="typo"?"½ Punkt – Schreibweise":"Lösung: "+esc(x.a.split("|")[0])}</b>${x.e&&r!=="ok"?` <span class="muted">– ${esc(x.e)}</span>`:""}</p>`}
    return `<div class="ex ${P.done?(fb.includes("--ok")?"ok":"bad"):""}"><p class="q"><b>${n}.</b> ${esc(x.q)}</p><input type="text" id="pr-${k}" data-pk="${k}" value="${esc(v)}" ${P.done?"disabled":""} autocomplete="off" autocapitalize="off" spellcheck="false" aria-label="Antwort ${n}">${fb}</div>`}).join("")}</section>`).join("");
  const pct=max?Math.round(pts/max*100):0;
  return `<header class="top"><div><p class="eyebrow">Simulation</p><h1>Probe-Schulaufgabe</h1></div>${P.done?"":`<span class="muted small">Gestartet ${new Date(P.start).toLocaleTimeString("de-DE",{hour:"2-digit",minute:"2-digit"})} Uhr</span>`}</header>
  ${P.done?`<section class="panel"><div class="row" style="gap:20px"><span class="grade">${grade(pct)}</span><div><b>${String(pts).replace(".",",")} von ${max} Punkten (${pct} %)</b><p class="muted small">Grobe Schätzung – deine Lehrkraft hat einen eigenen Notenschlüssel. Alle Fehler stehen jetzt im Logbuch, falsche Vokabeln im Problemstapel.</p></div></div>
   <div class="row"><button class="btn primary" data-act="view" data-v="log">Zum Fehler-Logbuch</button><button class="btn" data-act="probe-new">Neue Probe</button></div></section>`:""}
  ${html}
  ${P.done?"":`<div class="row"><button class="btn primary big" data-act="probe-end">Abgeben & auswerten</button></div>`}`;
}
function endProbe(){
  const P=S.probe;document.querySelectorAll("[data-pk]").forEach(i=>P.ans[i.dataset.pk]=i.value);
  P.sec.forEach((s,si)=>s.items.forEach((x,ii)=>{const v=P.ans[si+"-"+ii]||"";
   if(x.kind==="v"){const r=checkVocab(byId[x.card],v);if(r==="bad"){const st=cs(x.card);st.s="p";st.st=0;st.w++;addLog({key:"v:"+x.card,typ:"Probe · Vokabel",frage:x.q,falsch:v,richtig:x.a})}}
   else if(!checkEx(x.a,v))addLog({key:"e:"+x.q,typ:"Probe · "+s.t.split("·")[1].trim(),frage:x.q,falsch:v,richtig:x.a.split("|")[0],notiz:x.e||""})}));
  P.done=true;save();render();window.scrollTo(0,0);
}

/* ================== RENDER & EVENTS ================== */
function render(){
  renderNav();
  const v=S.view;
  $("#main").innerHTML=v==="plan"?vPlan():v==="cards"?vCards():v==="gram"?vGram():v==="words"?vWords():v==="log"?vLog():vTest();
  const a=$("#ans");if(a)a.focus({preventScroll:true});
}
document.addEventListener("click",e=>{
  const b=e.target.closest("[data-act]");if(!b)return;const d=b.dataset,act=d.act;
  if(b.tagName==="INPUT")return;
  switch(act){
   case "view":go(d.v);break;
   case "tick":S.plan[d.id]=!S.plan[d.id];save();render();break;
   case "goto":{const s=PLAN.flatMap(x=>x.steps).find(x=>x.id===d.id),g=s.go;
     if(g[0]==="cards"){startSession(g[1],g[2]);if(g[1]==="n"&&!SES.total&&counts(S.deck).f)startSession("f");}
     else if(g[0]==="gram"){S.gtab=g[1];go("gram")}
     else if(g[0]==="words"){S.wtab=g[1];go("words")}
     else if(g[0]==="log"){go("log");if(g[1])setTimeout(()=>{const el=document.getElementById(g[1]);if(el)el.scrollIntoView({behavior:"smooth"})},50)}
     else go(g[0]);break}
   case "deck":S.deck=d.d;SES=null;save();render();break;
   case "dir":S.dir=d.d;SES&&(SES.rev=false);save();render();break;
   case "typing":S.typing=d.t==="1";save();render();break;
   case "start":startSession(d.m,d.d);break;
   case "endses":SES=null;render();break;
   case "reveal":SES.rev=true;render();break;
   case "rate":rate(d.ok==="1");break;
   case "cycle":{const st=cs(d.id),o=["u","n","f","p","k"];st.s=o[(o.indexOf(st.s)+1)%5];st.st=0;save();render();break}
   case "gtab":S.gtab=d.t;save();render();break;
   case "wtab":S.wtab=d.t;save();render();break;
   case "wgo":S.wtab=d.t;go("words");break;
   case "gtgo":S.gtab=d.t;go("gram");break;
   case "pshow":S["ps_"+d.k]=true;render();break;
   case "phide":[0,1,2].forEach(i=>delete S["ps_"+d.t+i]);render();break;
   case "wo":S["wo_"+d.k]=!S["wo_"+d.k];save();render();break;
   case "exreset":S.exr[d.k]={};S["wo_"+d.k]=false;save();render();break;
   case "newquiz":QUIZ=makeQuiz(16);S.exr.quiz={};S.wo_quiz=false;render();break;
   case "solve":S.log[+d.i].solved=!S.log[+d.i].solved;save();render();break;
   case "probe-new":buildProbe();render();window.scrollTo(0,0);break;
   case "probe-end":endProbe();break;
   case "export":{const code=btoa(unescape(encodeURIComponent(JSON.stringify(S))));const t=$("#xfer");t.value=code;
     if(navigator.clipboard)navigator.clipboard.writeText(code).then(()=>toast("Code kopiert – jetzt auf dem anderen Gerät einfügen")).catch(()=>{t.select();toast("Code markiert – bitte kopieren")});else{t.select();toast("Code markiert – bitte kopieren")}break}
   case "import":{try{const o=JSON.parse(decodeURIComponent(escape(atob($("#xfer").value.trim()))));if(!o||!o.c)throw 0;S=Object.assign(fresh(),o);S.view="plan";save();render();toast("Fortschritt übernommen")}catch(err){toast("Der Code ist ungültig. Bitte komplett kopieren.")}break}
   case "reset-ask":$("#resetq").hidden=false;break;
   case "reset-no":$("#resetq").hidden=true;break;
   case "reset-do":S=fresh();SES=null;save();render();toast("Alles zurückgesetzt");break;
  }
});
document.addEventListener("change",e=>{const t=e.target,d=t.dataset;
  if(d.act==="trap"){S.trap[d.i]=t.checked;save();render()}
  if(d.act==="pat"){S.pat[d.k]=t.checked;save()}
  if(d.pk&&S.probe){S.probe.ans[d.pk]=t.value;save()}
});
document.addEventListener("input",e=>{const t=e.target;
  if(t.id==="search"){S.q=t.value;const pos=t.selectionStart;render();const n=$("#search");n.focus();n.setSelectionRange(pos,pos)}
  if(t.id==="fsearch"){S.fq=t.value;const pos=t.selectionStart;render();const n=$("#fsearch");n.focus();n.setSelectionRange(pos,pos)}
  if(t.id==="ownt"){S.own=t.value;save()}
  if(t.dataset.pk&&S.probe){S.probe.ans[t.dataset.pk]=t.value;clearTimeout(save.t);save.t=setTimeout(save,400)}
});
document.addEventListener("submit",e=>{e.preventDefault();const f=e.target,d=f.dataset;
  if(d.form==="type"){const v=$("#ans").value;const c=byId[SES.queue[0]];SES.res=checkVocab(c,v);SES.lastInput=v;SES.rev=true;render();const btn=document.querySelector('[data-act="rate"]');btn&&btn.focus()}
  if(d.form==="ex"){const k=d.k,i=+d.i,list=k==="quiz"?QUIZ:GRAM[k].ex,x=list[i],v=f.querySelector("input").value;
    const ok=checkEx(x.a,v);S.exr[k]=S.exr[k]||{};S.exr[k][i]=ok;
    if(!ok)addLog({key:"e:"+x.q,typ:k==="quiz"?"Syn./Gegenteil":GRAM[k].title,frage:x.q,falsch:v,richtig:x.a.split("|")[0],notiz:x.e||""});
    save();render();const nx=document.getElementById(`ex-${k}-${i+1}`);if(nx)nx.focus({preventScroll:false})}
  if(d.form==="log"){const lf=$("#lf").value.trim(),lr=$("#lr").value.trim();if(!lr&&!lf){toast("Bitte mindestens den Fehler oder die richtige Form eintragen");return}
    addLog({typ:"Eigener",falsch:lf,richtig:lr||"?",notiz:$("#ln").value.trim()});render();toast("Eingetragen")}
});
render();
if(window.__PWA__&&"serviceWorker" in navigator){navigator.serviceWorker.register("sw.js").catch(()=>{})}
</script>

</body>
