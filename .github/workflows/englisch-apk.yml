name: Englisch-APK bauen

on:
  push:
    branches: [ccr-f2bf0c68-kq6wou, main]
    paths: ["englisch/**", "android/**", ".github/workflows/englisch-apk.yml"]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  apk:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.9"
      - name: App-Seite in die APK kopieren
        run: |
          mkdir -p android/app/src/main/assets
          sed -e 's/window.__PWA__=true/window.__PWA__=false/' -e '/rel="manifest"/d' englisch/index.html > android/app/src/main/assets/index.html
      - name: APK bauen
        run: gradle -p android assembleDebug --no-daemon
      - name: APK umbenennen
        run: cp android/app/build/outputs/apk/debug/app-debug.apk Englisch-Crashkurs.apk
      - uses: actions/upload-artifact@v4
        with:
          name: Englisch-Crashkurs-APK
          path: Englisch-Crashkurs.apk
      - name: Als Download (Release) bereitstellen
        uses: softprops/action-gh-release@v2
        with:
          tag_name: englisch-apk
          name: Englisch Crashkurs (Android-App)
          target_commitish: ${{ github.sha }}
          make_latest: true
          body: |
            Englisch Crashkurs als Android-App (APK) für Handy und Tablet.
            Englisch-Crashkurs.apk auf dem Gerät herunterladen, öffnen und „Installieren“ tippen
            (beim ersten Mal „Aus dieser Quelle zulassen“ erlauben).
          files: Englisch-Crashkurs.apk
